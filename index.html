// Three trunks and ten lobes of canopy in three tones, back ones darkest. Three plain
// discs read as lollipops, and at 300 units a lollipop is a flat wall of one colour
// filling half the frame; lobes give the clump an inside and an outside.
function drawTrees(g, W, H, cols) {
  var tx = [0.22, 0.50, 0.78];
  for (var t = 0; t < 3; t++) fillRect(g, W * tx[t] - W * 0.016, H * 0.50, W * 0.032, H * 0.50, '#3a3128');
  // x, y, rx, ry, tone
  var lobes = [
    [0.22, 0.40, 0.20, 0.30, 0], [0.50, 0.30, 0.22, 0.28, 0], [0.78, 0.40, 0.20, 0.30, 0],
    [0.34, 0.48, 0.16, 0.22, 1], [0.62, 0.46, 0.17, 0.22, 1], [0.14, 0.52, 0.12, 0.16, 1],
    [0.88, 0.54, 0.11, 0.15, 1], [0.46, 0.22, 0.12, 0.14, 2], [0.26, 0.30, 0.10, 0.12, 2],
    [0.74, 0.32, 0.10, 0.12, 2]
  ];
  for (var i = 0; i < lobes.length; i++) {
    var L = lobes[i];
    g.fillStyle = cols[L[4]];
    g.beginPath();
    g.ellipse(W * L[0], H * L[1], W * L[2], H * L[3], 0, 0, Math.PI * 2);
    g.fill();
  }
}

// A deck-access block: six storeys, each a recessed balcony behind a balustrade. At eight
// it read as a barcode -- the bands have to be deep enough to look like a hole in the
// building and spaced enough to look like a floor.
function drawSlab(g, W, H, brown) {
  var body = brown ? '#6b4a3a' : MW.concrete;
  var edge = brown ? '#4a3328' : MW.concreteD;
  var recess = brown ? '#2a211c' : '#333a44';
  fillRect(g, 0, 0, W, H, body);
  for (var r = 0; r < 6; r++) {
    var y = H * (0.09 + r * 0.148);
    fillRect(g, W * 0.06, y, W * 0.88, H * 0.086, recess);
    fillRect(g, W * 0.06, y, W * 0.88, H * 0.016, '#1c1a19');
    fillRect(g, W * 0.06, y + H * 0.086, W * 0.88, H * 0.022, brown ? '#8a6a55' : MW.panel);
    for (var c = 0; c < 11; c++) {
      fillRect(g, W * (0.08 + c * 0.079), y + H * 0.048, W * 0.010, H * 0.038, '#5d656f');
    }
  }
  fillRect(g, 0, 0, W * 0.055, H, edge);
  fillRect(g, W * 0.945, 0, W * 0.055, H, edge);
  fillRect(g, 0, 0, W, H * 0.045, edge);
  fillRect(g, 0, H * 0.90, W, H * 0.10, MW.concreteK);
}

function drawGlass(g, W, H, tint) {
  fillRect(g, 0, 0, W, H, MW.glass[tint]);
  fillRect(g, 0, 0, W * 0.06, H, MW.panel);
  fillRect(g, W * 0.94, 0, W * 0.06, H, MW.panel);
  fillRect(g, 0, 0, W, H * 0.035, MW.panel);
  var floors = Math.max(4, Math.round(H / 26));
  for (var r = 0; r < floors; r++) {
    fillRect(g, W * 0.06, H * (0.05 + r * 0.95 / floors), W * 0.88, H * 0.010, 'rgba(255,255,255,0.30)');
  }
  for (var i = 0; i < 12; i++) {
    fillRect(g, W * (0.08 + i * 0.072), 0, W * 0.008, H, 'rgba(255,255,255,0.20)');
  }
  // A cold sheen down one side: flat glass reads as painted board without it.
  fillRect(g, W * 0.06, 0, W * 0.22, H, 'rgba(210,235,245,0.14)');
  fillRect(g, 0, H * 0.96, W, H * 0.04, MW.concreteK);
}

// The atlas. Built once, on the first frame of the screen that needs it. A landmark that
// varies by mark -- a gantry and its signs -- gets one sprite per variant, keyed by the
// mark's declaration, so the base sprite the harness checks always exists and a variant
// is built the first time the route asks for it.
var lmCanvas = {};
var lmBuilt = false;

function spriteKey(m) {
  return m.sign ? m.id + ':' + m.sign.join(',') : m.id;
}

function buildSprite(key, d, m) {
  // Sprite resolution follows real height, so a 58m tower gets more pixels than a 6m
  // sign, capped where upscaling stops being visible at this speed. Things that cross the
  // road are seen from underneath at four times the size of anything beside it, and get
  // the pixels for it; small signs get more still, because theirs is the only lettering
  // on the road that has to be read at a glance.
  var ppm = d.span ? 40 : (d.h < 10 ? 60 : 26);   // a 5m sign at 26 is 130px, and its lettering is a smear
  var ph = Math.max(48, Math.min(1440, Math.round(d.h * ppm)));
  var pw = Math.max(8, Math.round(ph * d.w / d.h));
  var c = document.createElement('canvas');
  c.width = pw;
  c.height = ph;
  var g = c.getContext('2d');
  if (g) {
    d.draw(g, pw, ph, m);
    // Below the deck line, everything fades into the gloom under the road. The deck sits
    // at a fixed fraction of a sprite whose base is below it, so the fade can be baked in
    // once: source-atop keeps it inside the sprite's own silhouette, which a rectangle
    // laid over it at draw time could not.
    if (d.base < 0) {
      var deckY = ph * (1 - (-d.base) / d.h);
      g.globalCompositeOperation = 'source-atop';
      var gr = g.createLinearGradient(0, deckY, 0, ph);
      gr.addColorStop(0, 'rgba(18,22,27,0)');
      gr.addColorStop(1, 'rgba(18,22,27,0.72)');
      g.fillStyle = gr;
      g.fillRect(0, deckY, pw, ph - deckY);
      g.globalCompositeOperation = 'source-over';
    }
  }
  lmCanvas[key] = c;
  return c;
}

function buildLandmarks() {
  if (lmBuilt) return;
  lmBuilt = true;
  for (var id in LANDMARKS) {
    if (!LANDMARKS.hasOwnProperty(id)) continue;
    buildSprite(id, LANDMARKS[id], null);
  }
}

function spriteFor(m) {
  var key = spriteKey(m);
  var c = lmCanvas[key];
  if (!c && LANDMARKS[m.id]) c = buildSprite(key, LANDMARKS[m.id], m);
  return c;
}

// --- The route. A place is an order of things, so the descriptor declares what stands
// --- where and the engine draws it. Positions come from the timestamp each landmark was
// --- surveyed at, times a single constant -- see MANCUNIAN-WAY.md.

function routeDef() {
  var rd = roadDef();
  return (rd && rd.route) || null;
}

// The lateral position of a mark, in world units, at its own z. `off` is metres from the
// centreline; negative is left.
function markX(m) {
  return roadCentre(m.z) + m.off * UNITS_PER_M;
}

// How solidly a landmark is drawn at this distance, and the two ends of that are the two
// things that were wrong with the first version. Far: a fade-in over the last stretch of
// the draw range, so a church does not appear fully formed at 88px, and a haze before
// that, because atmospheric perspective is the cheapest depth cue there is. Near, and
// only for things that CROSS the road: a fade to nothing between SPAN_FADE and SPAN_NEAR.
// The camera is 4.6m up with a very wide lens, so a gantry drawn all the way to the
// windscreen becomes a wall; faded, it reads as lifting over you. Things beside the road
// leave by the side of the frame, which is what a building does, and are not faded.
function landmarkAlpha(d, dz) {
  var a = 1;
  if (d.span) {
    if (dz <= SPAN_NEAR) return 0;
    if (dz < SPAN_FADE) a = (dz - SPAN_NEAR) / (SPAN_FADE - SPAN_NEAR);
  }
  var fadeFrom = LM_FAR - 600;
  if (dz > fadeFrom) a *= 0.45 * Math.max(0, LM_FAR - dz) / 600;
  else if (dz > LM_HAZE) a *= 1 - 0.55 * (dz - LM_HAZE) / (fadeFrom - LM_HAZE);
  return a;
}

// One landmark, projected and blitted. The sprite is a billboard facing the camera: at the
// speed this screen runs, turning a building to face you costs nothing anybody can see.
function drawLandmarkAt(m, zAbs) {
  var d = LANDMARKS[m.id];
  if (!d) return;                       // an unknown id draws nothing; the harness catches it
  var c = spriteFor(m);
  if (!c || !c.width) return;
  var dz = zAbs - game.camZ;
  if (dz < 40 || dz > LM_FAR) return;
  var alpha = landmarkAlpha(d, dz);
  if (alpha <= 0.01) return;
  var s = CAM_DEPTH / dz;

  var baseM = (m.base === undefined) ? d.base : m.base;
  var baseU = baseM * UNITS_PER_M;
  // `off` is metres from the centreline to the landmark's NEAR FACE, not to its middle.
  // Declared by the middle, a 62m-wide block set 30m out reaches to within a metre of the
  // centreline and is drawn standing on the carriageway -- which is a mistake nobody should
  // be able to make in a data table. Things that cross the road declare `span` and are
  // centred on it.
  var half = d.w * UNITS_PER_M / 2;
  var x = d.span ? roadCentre(zAbs)
                 : roadCentre(zAbs) + (m.off < 0 ? -1 : 1) * (Math.abs(m.off) * UNITS_PER_M + half);
  var wPx = d.w * UNITS_PER_M * s;
  if (wPx < 2) return;
  var top = HORIZON_Y + (CAM_H - (baseU + d.h * UNITS_PER_M)) * s;
  var bot = HORIZON_Y + (CAM_H - baseU) * s;
  var sx = WORLD_W / 2 + (x - bert.roadX) * s - wPx / 2;
  if (sx > CANVAS_WIDTH + 40 || sx + wPx < -40) return;
  if (bot < -200 || top > CANVAS_HEIGHT + 200) return;
  if (alpha < 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.drawImage(c, sx, top, wPx, bot - top);
    ctx.restore();
  } else {
    ctx.drawImage(c, sx, top, wPx, bot - top);
  }
}

// Everything standing in road space this frame -- the route's landmarks and the lamp
// columns -- as one list sorted far to near, so the road loop can draw each one just
// before the first band that is nearer than it. That is the whole depth rule: road,
// building, bridge and lamp occlude each other by distance, whichever they are. The two
// earlier versions each got half of it -- buildings drawn over nearer road, then all road
// drawn over all buildings -- and both were wrong on a bend.
//
// The route repeats: the lap is sized so one playthrough sees it once, and a slow player
// goes round again rather than running out of road. LM_FAR is under a lap, so at most two
// laps can be in view.
function routeScene() {
  var list = [];
  var rt = routeDef();
  if (rt) {
    buildLandmarks();
    var lap = rt.lap, marks = rt.marks;
    var base = Math.floor(game.camZ / lap) * lap;
    for (var pass = 0; pass <= 1; pass++) {
      var off = base + pass * lap;
      for (var i = 0; i < marks.length; i++) {
        var z = off + marks[i].z;
        var dz = z - game.camZ;
        if (dz < 40 || dz > LM_FAR) continue;
        list.push({ z: z, mark: marks[i] });
      }
    }
  }
  // The lamp columns. They alternate sides on the real road rather than standing in pairs.
  var step = LAMP_SPACING_M * UNITS_PER_M;
  var z0 = Math.ceil((game.camZ + 60) / step) * step;
  for (var lz = z0; lz - game.camZ <= DRAW_DIST; lz += step) {
    list.push({ z: lz, lamp: (Math.round(lz / step) % 2) ? 1 : -1 });
  }
  list.sort(function (a, b) { return b.z - a.z; });
  return list;
}

function drawSceneItem(it, camX) {
  if (it.mark) drawLandmarkAt(it.mark, it.z);
  else drawLampAt(it.z, it.lamp, camX);
}

// Painted road markings, laid on the tarmac in the perspective the tarmac already has.
// "M602 RING ROAD" is on the carriageway at 2:00 in the footage, elongated the way real
// road lettering is so it reads from a low angle -- which is free here, because the
// projection squashes it exactly that much on the way back.
function drawRoadPaint() {
  var rt = routeDef();
  if (!rt || !rt.paint) return;
  var lap = rt.lap;
  var base = Math.floor(game.camZ / lap) * lap;
  for (var pass = 0; pass <= 1; pass++) {
    for (var i = 0; i < rt.paint.length; i++) {
      var p = rt.paint[i];
      var z = base + pass * lap + p.z;
      var dz = z - game.camZ;
      if (dz < 120 || dz > 1500) continue;
      var s = CAM_DEPTH / dz;
      var y = HORIZON_Y + CAM_H * s;
      var x = WORLD_W / 2 + (roadCentre(z) + (p.off || 0) * UNITS_PER_M - bert.roadX) * s;
      var size = 3.2 * UNITS_PER_M * s;
      if (size < 5) continue;
      ctx.save();
      ctx.globalAlpha = Math.min(1, (dz - 120) / 260) * 0.85;
      ctx.fillStyle = '#e8e2d4';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // Squashed vertically on top of the perspective, which is what the real paint does.
      ctx.font = 'bold ' + Math.round(size) + 'px ' + SIGN_FACE;
      ctx.translate(x, y);
      ctx.scale(1, 0.42);
      ctx.fillText(p.text, 0, 0);
      ctx.restore();
    }
  }
}

// The parapet, drawn one band at a time alongside the tarmac. Board-marked concrete: the
// shutter boards were of irregular width, so the ribs are too, and that irregularity is
// what stops it reading as generic corduroy. The pattern is an authored table rather than
// a random function, for the same reason the Crossing's traffic is evenly spaced -- a
// backdrop that comes out different every load is a backdrop nobody can review.
//
// Drawing it per band is what gives it perspective for free: consecutive scanlines are
// further apart in z the nearer they are, so the ribs widen towards the camera exactly as
// they should. The reference frame is 2:00, the cutting wall, which is the same concrete.
var RIBS = ['#828a97', '#6d7581', '#5b636d', '#8d95a2', '#666e79', '#7a8290',
            '#545c66', '#858d9a', '#717985', '#5f6771', '#8a92a0', '#69717c',
            '#7d8593', '#585f69', '#838b98', '#6b737e'];
var PARAPET_M = 1.15;        // window height on the real road, which is exactly why the drop never reads from a car
var PARAPET_T = 0.42;        // thickness, in metres

function drawParapet(x, sy, s, z, side) {
  var hPx = PARAPET_M * UNITS_PER_M * s;
  if (hPx < 1.5) return;
  var w = Math.max(1, PARAPET_T * UNITS_PER_M * s);
  var top = sy - hPx;
  ctx.fillStyle = RIBS[(Math.floor(z / 7) % RIBS.length + RIBS.length) % RIBS.length];
  ctx.fillRect(side < 0 ? x - w : x, top, w, hPx + 1);
  // The coping, and the steel rail that stands on it.
  ctx.fillStyle = '#a7aeb9';
  ctx.fillRect(side < 0 ? x - w : x, top, w, Math.max(1, hPx * 0.10));
  var rail = hPx * 0.34;
  if (rail > 2) {
    ctx.fillStyle = '#4d545e';
    ctx.fillRect(side < 0 ? x - w : x, top - rail, w * 0.55, Math.max(1, rail * 0.14));
    ctx.fillRect(side < 0 ? x - w : x, top - rail * 0.55, w * 0.55, Math.max(1, rail * 0.14));
  }
}

// --- The road. One pass down the screen: for each band, invert the projection to get the
// --- distance, ask the descriptor where the centreline is there, and fill. Perspective
// --- comes out of the arithmetic rather than out of a texture.

function drawRoad() {
  var camX = bert.roadX;
  var scene = routeScene();
  var si = 0;

  for (var sy = HORIZON_Y + 1; sy < CANVAS_HEIGHT; sy += ROAD_BAND) {
    var s = (sy - HORIZON_Y) / CAM_H;
    var dz = CAM_DEPTH / s;
    // Anything further away than this band goes down first, so the band then covers it.
    while (si < scene.length && scene[si].z - game.camZ >= dz) drawSceneItem(scene[si++], camX);
    if (dz > DRAW_DIST) continue;
    var z = game.camZ + dz;
    var cx = WORLD_W / 2 + (roadCentre(z) - camX) * s;
    var half = ROAD_HALF * s;
    var h = ROAD_BAND + 1;                 // the extra pixel is what stops seams between bands

    // Alternating tarmac, banded by distance. This is the only thing on screen that carries
    // speed once you are on a straight, so the band length is short enough to strobe.
    var alt = Math.floor(z / 58) % 2;
    ctx.fillStyle = alt ? '#3d474c' : '#364045';
    ctx.fillRect(cx - half, sy, half * 2, h);

    // The verge beyond the tarmac: olive, not green. Shot in autumn, and worth keeping --
    // it dates the place to a season.
    ctx.fillStyle = alt ? '#46442e' : '#3e3c29';
    ctx.fillRect(cx - half - half * 0.09, sy, half * 0.09, h);

    // The edge of the deck itself: the fascia beam the whole viaduct sits on. Without it
    // the tarmac just stops and the dark beyond reads as more ground rather than as a
    // hundred feet of nothing -- and the drop is the only thing this screen kills with.
    ctx.fillStyle = '#5c626a';
    ctx.fillRect(cx - half - half * 0.135, sy, half * 0.045, h);
    ctx.fillStyle = '#2a2f35';
    ctx.fillRect(cx - half - half * 0.175, sy, half * 0.04, h);
    drawParapet(cx - half - half * 0.09, sy, s, z, -1);

    // The slip road, where there is one. Newer, paler concrete, so it reads as something
    // added to the deck rather than as the deck getting wider.
    var sw = slipWidth(z) * s;
    if (sw > 0) {
      ctx.fillStyle = alt ? '#4b535a' : '#434b52';
      ctx.fillRect(cx + half, sy, sw, h);
      // ...and the last stretch of it striped, because a ramp that ends in mid-air has to
      // be readable before you are on it and not after.
      var end = slipEndAhead(z);
      if (end >= 0 && end < 220) {
        ctx.fillStyle = (Math.floor(z / 30) % 2) ? '#d8443a' : '#e8e2d4';
        ctx.fillRect(cx + half, sy, sw, h);
      }
    } else {
      ctx.fillStyle = alt ? '#46442e' : '#3e3c29';
      ctx.fillRect(cx + half, sy, half * 0.09, h);
      ctx.fillStyle = '#5c626a';
      ctx.fillRect(cx + half + half * 0.09, sy, half * 0.045, h);
      ctx.fillStyle = '#2a2f35';
      ctx.fillRect(cx + half + half * 0.135, sy, half * 0.04, h);
      drawParapet(cx + half + half * 0.09, sy, s, z, 1);
    }

    // Rumble strip on both edges of the carriageway, and the centre dashes.
    var rum = Math.max(1, half * 0.055);
    ctx.fillStyle = (Math.floor(z / 26) % 2) ? '#e8e2d4' : '#b03a30';
    ctx.fillRect(cx - half, sy, rum, h);
    if (sw <= 0) ctx.fillRect(cx + half - rum, sy, rum, h);

    if (Math.floor(z / 44) % 2) {
      ctx.fillStyle = 'rgba(233,226,212,0.72)';
      var lw = Math.max(1, half * 0.022);
      ctx.fillRect(cx - lw / 2, sy, lw, h);
      ctx.fillRect(cx - half * 0.34 - lw / 2, sy, lw, h);
      ctx.fillRect(cx + half * 0.34 - lw / 2, sy, lw, h);
    }
  }
  // Whatever is nearer than the nearest band -- a lamp about to pass the camera.
  while (si < scene.length) drawSceneItem(scene[si++], camX);

  drawRoadPaint();
}

// Lamp columns: what the footage actually has beside the road -- tall slender columns
// with a shallow arm, marching away down the deck. They are most of what gives a straight
// its sense of speed once the tarmac texture has gone flat.
// 26m, not 42. At 42 the draw distance holds barely one column and a straight has
// nothing marching down it -- which is the cue that carries speed once the tarmac
// texture goes flat.
var LAMP_SPACING_M = 26;
var LAMP_H_M = 11;

function drawLampAt(z, side, camX) {
  var dz = z - game.camZ;
  if (dz < 60) return;
  var s = CAM_DEPTH / dz;
  var sy = HORIZON_Y + CAM_H * s;
  if (sy > CANVAS_HEIGHT + 60) return;
  var h = LAMP_H_M * UNITS_PER_M * s;
  if (h < 3) return;
  var w = Math.max(1, 0.5 * UNITS_PER_M * s);
  var x = WORLD_W / 2 + (roadCentre(z) + side * (ROAD_HALF + 1.6 * UNITS_PER_M) - camX) * s;
  var top = sy - h;
  ctx.fillStyle = '#4e555f';
  ctx.fillRect(x - w / 2, top, w, h);
  // The arm reaches back over the carriageway, which is what makes a column read as a
  // street light rather than as a flagpole; the lantern hangs off the end of it.
  var arm = 3.2 * UNITS_PER_M * s;
  var armX = side > 0 ? x - arm : x;
  ctx.fillRect(armX, top, arm, Math.max(1, w * 0.8));
  ctx.fillStyle = '#9aa2ad';
  ctx.fillRect(side > 0 ? armX - w : armX + arm, top, Math.max(1, w * 1.6), Math.max(1, w * 1.4));
}

// THE CONCOURSE: a service corridor under a stand. Walls are drawn from the same maze the
// engine reads, so what looks solid is solid.
function drawConcourse(g) {
  var m = (level.map && level.map.maze) || [];
  g.fillStyle = '#0b0f14';
  g.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
  // Floor: bare concrete with a scuffed sheen, so the corridors read as walkable.
  g.fillStyle = '#191f27';
  for (var r = 0; r < m.length; r++) {
    for (var c = 0; c < m[r].length; c++) {
      if (m[r].charAt(c) !== '#') g.fillRect(c * TILE, r * TILE, TILE, TILE);
    }
  }
  for (var sr = 0; sr < m.length; sr++) {
    for (var sc = 0; sc < m[sr].length; sc++) {
      if (m[sr].charAt(sc) === '#') continue;
      g.fillStyle = 'rgba(255,255,255,0.025)';
      g.fillRect(sc * TILE + 6, sr * TILE + 6, TILE - 12, 3);
    }
  }
  // Walls: blockwork with a lit top edge. Red, because this is Old Trafford and the
  // Frauds have had the run of it.
  for (var wr = 0; wr < m.length; wr++) {
    for (var wc = 0; wc < m[wr].length; wc++) {
      if (m[wr].charAt(wc) !== '#') continue;
      var x = wc * TILE, y = wr * TILE;
      g.fillStyle = '#4a1418';
      g.fillRect(x, y, TILE, TILE);
      g.fillStyle = '#5d1b20';
      g.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
      g.fillStyle = 'rgba(255,180,180,0.16)';
      g.fillRect(x + 2, y + 2, TILE - 4, 3);
      g.strokeStyle = 'rgba(0,0,0,0.35)';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(x + 2, y + TILE / 2);
      g.lineTo(x + TILE - 2, y + TILE / 2);
      g.stroke();
    }
  }
}

// --- Rendering

// Dev aid: no longer in the UI (this is a public build). Flip it from the console --
// showHitboxes = true -- to see the two-box model.
var showHitboxes = false;

function drawPixelGrid(grid, palette, x, y, pixelSize) {
  for (var r = 0; r < grid.length; r++) {
    for (var c = 0; c < grid[r].length; c++) {
      var v = grid[r][c];
      if (v === 0) continue;
      ctx.fillStyle = palette[v];
      ctx.fillRect(x + c * pixelSize, y + r * pixelSize, pixelSize, pixelSize);
    }
  }
}

function drawCharacter(def, x, y, facing) {
  var b = bodyRect(def, x, y);
  ctx.save();
  if (facing < 0) {
    ctx.translate(b.x + b.w / 2, 0);
    ctx.scale(-1, 1);
    ctx.translate(-(b.x + b.w / 2), 0);
  }
  drawPixelGrid(gridOf(def), def.palette, x, y, def.pixelSize);
  var h = headRect(def, x, y);
  var s = def.head;
  if (s.img.complete && s.img.naturalWidth) {
    ctx.drawImage(s.img, s.sx, s.sy, s.sw, s.sh, h.x, h.y, h.w, h.h);
  }
  ctx.restore();

  if (showHitboxes) {
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#ff2fd0';
    ctx.strokeRect(h.x, h.y, h.w, h.h);
    ctx.strokeStyle = '#7cfc00';
    ctx.strokeRect(b.x, b.y, b.w, b.h);
  }
}

function drawEntity(e) {
  var b = bodyOf(e);
  ctx.save();
  if (e.dying) {
    ctx.globalAlpha = Math.max(0, 1 - e.deathTimer / DEATH_ANIM);
    ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
    ctx.rotate(e.spin);
    ctx.translate(-(b.x + b.w / 2), -(b.y + b.h / 2));
  } else if (e.type === 'giant' && e.invulnTimer > 0) {
    ctx.globalAlpha = (Math.floor(e.invulnTimer * 10) % 2) ? 0.4 : 1;
  } else if (e.type === 'bert' && e.invincible > 0) {
    ctx.globalAlpha = (Math.floor(e.invincible * 12) % 2) ? 0.35 : 1;
  }
  // Armed. An ordinary hammer flashes out over its last second; the big one does not,
  // because it never expires.
  var armed = e.type === 'bert' && (e.hammer > 0 || e.bigHammer > 0) && !e.dying &&
              (e.bigHammer > 0 || e.hammer > 1 || Math.floor(e.hammer * 12) % 2);
  var big = armed && e.bigHammer > 0;
  var hw = big ? 52 : 26;
  var hh = big ? 68 : 34;

  // The swing, drawn BEHIND the character on purpose. The head is a 44px photo on a 24px
  // body, so a hammer swung from the shoulder crosses it somewhere in every arc, and a
  // photo face with a mallet over it reads as a bug rather than as a swing. Behind him it
  // passes behind his head, and the ends of the arc -- the part that carries the motion --
  // are outside his silhouette anyway.
  if (armed && e.swing > 0) {
    var span = big ? BIG_SWING_TIME : SWING_TIME;
    var t = 1 - e.swing / span;
    // Out fast, back slower: the strike is the first 55% of the swing, and that is the
    // part swingBox() calls live.
    var k = t < 0.55 ? t / 0.55 : 1 - (t - 0.55) / 0.45;
    var ang = HAMMER_REST + k * (HAMMER_STRIKE - HAMMER_REST);
    ctx.save();
    // Pivot at the shoulder, so the head passes over him and down in front rather than
    // sliding sideways. Rotation is mirrored by facing, so one arc serves both directions.
    ctx.translate(b.x + b.w / 2, b.y + b.h * 0.28);
    ctx.rotate(e.facing * ang);
    drawHammer(-hw / 2, -hh, hw, hh);
    ctx.restore();
  }

  // Powered: a ring under Bert, and the Frauds go pale with fright. Something has to say
  // which way round the screen currently works, and a timer bar alone does not sell it.
  if (level.engine === 'maze' && bert.powered > 0 && !e.dying) {
    var mb = bodyOf(e);
    if (e.type === 'bert') {
      ctx.strokeStyle = 'rgba(255,224,122,' + (bert.powered < 2 && Math.floor(bert.powered * 8) % 2 ? 0.25 : 0.85) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(mb.x + mb.w / 2, mb.y + mb.h / 2, mb.w * 0.95, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.globalAlpha *= 0.55;
    }
  }

  drawCharacter(e.def, e.x, e.y, e.facing);

  // At rest it goes back in front, held out to the side and clear of the head -- which is
  // the widest part of a character, and where the shipped build already put it. Behind the
  // photo, a resting hammer is invisible, and then nothing on the sprite says he is armed.
  if (armed && e.swing <= 0) {
    drawHammer(b.x + (e.facing > 0 ? b.w + 4 : -(hw + 4)), b.y - hh, hw, hh);
  }

  // The trophy, in his leading hand. Drawn after the character so it reads as held rather
  // than as something he is standing behind.
  if (e.type === 'giant' && e.hasTrophy && !e.dying) {
    var tr = trophyRect(e);
    drawTrophy(tr.x, tr.y, tr.w, tr.h);
  }

  // Wind-up tell: a charging fireball at the Giant's shoulder before every throw.
  if (e.type === 'giant' && e.windup > 0 && !e.dying) {
    var gh = headOf(e);
    var prog = 1 - e.windup / THROW_WINDUP;
    var ox = gh.x + gh.w / 2 + e.facing * (gh.w * 0.5);
    var oy = gh.y + gh.h * 0.75;
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#ff7a12';
    ctx.beginPath();
    ctx.arc(ox, oy, 4 + prog * 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffe07a';
    ctx.beginPath();
    ctx.arc(ox, oy, (4 + prog * 9) * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

// --- The Mode 7 cast. Everything with a place on the road is projected, sorted far to
// --- near and drawn in that order, because on a road that is the only depth cue there is.

// A kart, seen from behind. One shell at three sizes: the character's own body width sets
// the scale, so a Mini's kart is a Mini's kart without a second set of numbers.
function drawKartShell(w, pal, lean) {
  var kw = w * 1.65;
  var kh = w * 0.66;
  ctx.save();
  if (lean) ctx.rotate(lean * 0.07);
  // Tyres first, so the body sits over them.
  ctx.fillStyle = pal.tyre;
  ctx.fillRect(-kw / 2, -kh, kw * 0.27, kh);
  ctx.fillRect(kw / 2 - kw * 0.27, -kh, kw * 0.27, kh);
  ctx.fillStyle = pal.rim;
  ctx.fillRect(-kw / 2 + kw * 0.07, -kh * 0.72, kw * 0.13, kh * 0.34);
  ctx.fillRect(kw / 2 - kw * 0.2, -kh * 0.72, kw * 0.13, kh * 0.34);
  // Body, and a spoiler across the back -- the one silhouette line that says "kart" at
  // twenty pixels tall.
  ctx.fillStyle = pal.shell;
  ctx.fillRect(-kw * 0.33, -kh * 1.02, kw * 0.66, kh * 0.86);
  ctx.fillStyle = pal.trim;
  ctx.fillRect(-kw * 0.42, -kh * 1.2, kw * 0.84, kh * 0.24);
  ctx.restore();
}

// px, py is the point on the road; the sprite stands on it.
function drawKartAt(def, pal, px, py, scale, opts) {
  var b = bodyRect(def, 0, 0);
  opts = opts || {};
  ctx.save();
  ctx.translate(px, py);
  ctx.scale(scale, scale);
  if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;
  if (opts.spin) {
    ctx.rotate(opts.spin);
  }
  // Driven over: flattened into the tarmac rather than spun away, because on this screen
  // the kill is a kart going over the top of them and it should look like it.
  if (opts.squash) ctx.scale(1.35, 0.3);
  drawKartShell(b.w, pal, opts.lean || 0);
  drawCharacter(def, -b.w / 2, -b.h - b.w * 0.42, 1);
  ctx.restore();
}

// A sinkhole: the hole itself, a broken rim, and the roadworks round it -- cones at the
// corners and a striped barrier across the far side. The cones are the point: orange is
// visible long before a dark patch of tarmac is, and on this screen cones only ever mean
// a hole.
function drawHoleAt(p) {
  var rx = HOLE_X * p.s, rz = HOLE_Z * p.s * 0.34;
  ctx.fillStyle = '#5a6168';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, rx * 1.18, rz * 1.35, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#0b0d10';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, rx, rz, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1e2126';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y - rz * 0.25, rx * 0.7, rz * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();
  // The barrier, across the far side, striped red and white.
  var bw = rx * 2.6, bh = Math.max(2, 22 * p.s), by = p.y - rz * 1.9;
  var stripes = 6;
  for (var k = 0; k < stripes; k++) {
    ctx.fillStyle = (k % 2) ? '#e8e2d4' : '#d8443a';
    ctx.fillRect(p.x - bw / 2 + bw * k / stripes, by - bh, bw / stripes + 0.5, bh);
  }
  ctx.fillStyle = '#4d545e';
  ctx.fillRect(p.x - bw / 2, by, Math.max(1, 3 * p.s), bh * 0.6);
  ctx.fillRect(p.x + bw / 2 - Math.max(1, 3 * p.s), by, Math.max(1, 3 * p.s), bh * 0.6);
  // Four cones.
  var ch = Math.max(3, 40 * p.s), cw = ch * 0.55;
  var cx = [p.x - rx * 1.4, p.x + rx * 1.4, p.x - rx * 1.4, p.x + rx * 1.4];
  var cy = [p.y - rz * 1.2, p.y - rz * 1.2, p.y + rz * 1.5, p.y + rz * 1.5];
  for (var c = 0; c < 4; c++) {
    ctx.fillStyle = '#ef6a1a';
    ctx.beginPath();
    ctx.moveTo(cx[c] - cw / 2, cy[c]);
    ctx.lineTo(cx[c] + cw / 2, cy[c]);
    ctx.lineTo(cx[c], cy[c] - ch);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#f4f4f4';
    ctx.fillRect(cx[c] - cw * 0.22, cy[c] - ch * 0.5, cw * 0.44, Math.max(1, ch * 0.14));
  }
}

// The extra life: Bert's own head in a ring, bobbing over the drop where the ramp ends.
function drawLifeAt(p) {
  var r = Math.max(4, 26 * p.s);
  var bob = Math.sin(game.runTime * 4) * r * 0.25;
  var y = p.y - r * 1.6 + bob;
  ctx.save();
  ctx.globalAlpha = 0.55 + 0.25 * Math.sin(game.runTime * 6);
  ctx.strokeStyle = '#ffe07a';
  ctx.lineWidth = Math.max(1, r * 0.18);
  ctx.beginPath();
  ctx.arc(p.x, y, r * 1.25, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
  var s = HEAD_SRC.bert;
  if (s.img.complete && s.img.naturalWidth) {
    var iw = r * 1.6, ih = iw * (s.sh / s.sw);
    ctx.drawImage(s.img, s.sx, s.sy, s.sw, s.sh, p.x - iw / 2, y - ih / 2, iw, ih);
  }
}

// The blackout under the viaduct, as a full-screen overlay: the one thing on this screen
// that is not in the painter's list, because it is in front of everything by definition.
function blackoutAlpha() {
  var rt = routeDef();
  if (!rt || !rt.blackout) return 0;
  var b = rt.blackout;
  var d = lapZ(bertZ()) - b.at;
  // The hold reaches across the wrap, so early-lap positions count as past the viaduct.
  if (d < -rt.lap / 2) d += rt.lap;
  if (d < -b.fade || d > b.hold + b.fade) return 0;
  if (d < 0) return 1 + d / b.fade;
  if (d <= b.hold) return 1;
  return 1 - (d - b.hold) / b.fade;
}

function drawBlackout() {
  var a = blackoutAlpha();
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = '#04060a';
  ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
  ctx.restore();
}

function drawMode7Cast() {
  var i, e, p;
  var items = [];

  // Oil and item boxes are flat on the road, so they go in the same sort as everything
  // else -- a slick in front of a kart has to be drawn after it.
  for (i = 0; i < game.oil.length; i++) items.push({ z: game.oil[i].z, kind: 'oil', o: game.oil[i] });
  for (i = 0; i < game.boxes.length; i++) items.push({ z: game.boxes[i].z, kind: 'box', o: game.boxes[i] });
  for (i = 0; i < game.balls.length; i++) items.push({ z: game.balls[i].z, kind: 'ball', o: game.balls[i] });
  // Sinkholes and the extra life recur per lap like the landmarks: whichever laps are in
  // draw range contribute theirs.
  var rd = roadDef();
  if (rd && rd.route) {
    var lap = rd.route.lap;
    var lapBase = Math.floor(game.camZ / lap) * lap;
    var ls = game.lifeTaken ? null : lifeSpot();
    for (var pass = 0; pass <= 1; pass++) {
      var off = lapBase + pass * lap;
      if (rd.holes) {
        for (i = 0; i < rd.holes.length; i++) {
          var hz = off + rd.holes[i].z;
          if (hz - game.camZ < -100 || hz - game.camZ > DRAW_DIST) continue;
          items.push({ z: hz, kind: 'hole', o: { roadX: holeX(rd.holes[i], hz), z: hz } });
        }
      }
      if (ls && off + ls.z - game.camZ > -100 && off + ls.z - game.camZ < DRAW_DIST) {
        items.push({ z: off + ls.z, kind: 'life', o: { roadX: ls.roadX, z: off + ls.z } });
      }
    }
  }
  for (i = 0; i < game.frauds.length; i++) {
    e = game.frauds[i];
    if (e.z === undefined) continue;
    items.push({ z: e.z, kind: 'kart', o: e });
  }
  if (!game.plunge) items.push({ z: bertZ(), kind: 'bert', o: bert });

  items.sort(function (a, b) { return b.z - a.z; });

  for (i = 0; i < items.length; i++) {
    var it = items[i];
    e = it.o;
    p = project(it.kind === 'bert' ? bert.roadX : e.roadX, it.z);
    if (p.scale < 0.02 || p.y < HORIZON_Y || p.y > CANVAS_HEIGHT + 200) continue;

    if (it.kind === 'hole') {
      drawHoleAt(p);
    } else if (it.kind === 'life') {
      drawLifeAt(p);
    } else if (it.kind === 'oil') {
      ctx.save();
      ctx.globalAlpha = Math.min(1, e.life / 1.2) * 0.85;
      ctx.fillStyle = '#14121a';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, OIL_X * p.s, OIL_X * p.s * 0.34, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(120,90,190,0.35)';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y - 1, OIL_X * p.s * 0.6, OIL_X * p.s * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else if (it.kind === 'box') {
      var bs = 44 * p.s;
      ctx.save();
      ctx.translate(p.x, p.y - bs * 0.6);
      // Turning slowly, so it reads as a pickup and not as a crate someone left there.
      ctx.rotate(Math.sin(game.runTime * 2 + e.z) * 0.35);
      ctx.fillStyle = '#e8c14a';
      ctx.fillRect(-bs / 2, -bs / 2, bs, bs);
      ctx.fillStyle = '#8a6a12';
      ctx.fillRect(-bs / 2, -bs / 2, bs, Math.max(1, bs * 0.16));
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-bs * 0.16, -bs * 0.16, bs * 0.32, bs * 0.32);
      ctx.restore();
    } else if (it.kind === 'ball') {
      var br = 13 * p.s * (e.from === 'boss' ? 1.25 : 1);
      ctx.fillStyle = e.from === 'boss' ? '#ff7a12' : '#f2f2f2';
      ctx.beginPath();
      ctx.arc(p.x, p.y - br, br, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = e.from === 'boss' ? '#ffe07a' : '#1a1a1a';
      ctx.beginPath();
      ctx.arc(p.x, p.y - br, br * 0.45, 0, Math.PI * 2);
      ctx.fill();
    } else if (it.kind === 'kart') {
      var pal = KART_FRAUD_PAL;
      var op = {};
      if (e.dying) { op.alpha = Math.max(0, 1 - e.deathTimer / DEATH_ANIM); op.squash = true; }
      else if (e.type === 'giant' && e.invulnTimer > 0) {
        op.alpha = (Math.floor(e.invulnTimer * 10) % 2) ? 0.4 : 1;
      }
      drawKartAt(e.def, pal, p.x, p.y, p.scale, op);
    } else {
      // Bert. His scale is 1 by construction -- BERT_DZ is where the projection's unit
      // distance is -- so this is the one sprite on the screen drawn at its authored size.
      var bop = { lean: bert.lean };
      if (bert.spinOut > 0) bop.spin = bert.spin;
      if (bert.invincible > 0 && !bert.dying) {
        bop.alpha = (Math.floor(bert.invincible * 12) % 2) ? 0.35 : 1;
      }
      // The boost, as a pair of flames out of the back, and the only feedback the button
      // gets. A cooldown you cannot see is a button that feels broken.
      if (bert.boost > 0) {
        ctx.save();
        ctx.globalAlpha = 0.55 + Math.random() * 0.35;
        ctx.fillStyle = '#ff9a2a';
        ctx.fillRect(p.x - 26, p.y - 6, 12, 10);
        ctx.fillRect(p.x + 14, p.y - 6, 12, 10);
        ctx.fillStyle = '#ffe07a';
        ctx.fillRect(p.x - 23, p.y - 4, 6, 6);
        ctx.fillRect(p.x + 17, p.y - 4, 6, 6);
        ctx.restore();
      }
      // A shadow on the tarmac while he is off it, so the hop has a height you can read.
      if (bert.air > 0) {
        ctx.save();
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, 30, 9, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      drawKartAt(bert.def, KART_PALETTE, p.x, p.y - (bert.air > 0 ? kartAirRise() : 0), 1, bop);
    }
  }
}

// The plunge, drawn on its own: both of them off the deck, and the canal coming up. The
// road is still there above them, which is what makes it read as a fall rather than a cut.
function drawPlunge() {
  var pl = game.plunge;
  var t = Math.min(1, pl.t / PLUNGE_TIME);
  // The water rises to meet them. It is the same colour as the canal in the backdrop and
  // the same colour THE CUT opens on.
  var wh = CANVAS_HEIGHT * 0.62 * t * t;
  if (wh > 1) {
    var wg = ctx.createLinearGradient(0, CANVAS_HEIGHT - wh, 0, CANVAS_HEIGHT);
    wg.addColorStop(0, 'rgba(29,58,68,0.55)');
    wg.addColorStop(1, '#14303a');
    ctx.fillStyle = wg;
    ctx.fillRect(0, CANVAS_HEIGHT - wh, CANVAS_WIDTH, wh);
    ctx.fillStyle = 'rgba(150,200,225,0.14)';
    for (var x = 0; x < CANVAS_WIDTH; x += 88) {
      ctx.fillRect(x + (pl.t * 30) % 88, CANVAS_HEIGHT - wh + 14, 44, 3);
    }
  }

  // Him first: he went over the edge a beat earlier and is further down.
  var gs = pl.gs * (1 - 0.25 * t);
  drawKartAt(CHAR_DEFS[level.boss.form], KART_FRAUD_PAL, pl.gxNow, pl.gyNow, Math.max(0.05, gs),
    { spin: pl.t * 1.6 });

  if (pl.over) {
    var bb = bodyRect(bert.def, 0, 0);
    drawKartAt(bert.def, KART_PALETTE, bert.x + bb.w / 2, bert.y + bb.h,
      1 - 0.2 * t, { spin: (pl.t - PLUNGE_LEAD) * 1.9 });
  }
}

function drawBalls() {
  for (var i = 0; i < game.balls.length; i++) {
    var b = game.balls[i];
    for (var t = b.trail.length - 1; t >= 0; t--) {
      var p = b.trail[t];
      var f = 1 - t / b.trail.length;
      ctx.globalAlpha = f * 0.5;
      ctx.fillStyle = (t % 2) ? '#ff8a1f' : '#ffd45e';
      ctx.beginPath();
      ctx.arc(p.x, p.y, BALL_RADIUS * f * 0.9, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#ff7a12';
    ctx.beginPath();
    ctx.arc(b.x, b.y, BALL_RADIUS + 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f4f4f4';
    ctx.beginPath();
    ctx.arc(b.x, b.y, BALL_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    for (var k = 0; k < 3; k++) {
      var a = b.spin + k * (Math.PI * 2 / 3);
      ctx.beginPath();
      ctx.arc(b.x + Math.cos(a) * BALL_RADIUS * 0.45,
              b.y + Math.sin(a) * BALL_RADIUS * 0.45,
              BALL_RADIUS * 0.28, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawPlatforms() {
  if (level.platformStyle === 'girder') { drawGirders(); return; }
  drawGoalposts();
}

// Steel beams with rivets and cross-bracing hung beneath, so a girder reads as structure
// rather than as a floating bar.
function drawGirders() {
  var plats = level.platforms;
  for (var i = 0; i < plats.length; i++) {
    var p = plats[i];
    var beamBottom = p.y + p.height;

    ctx.strokeStyle = 'rgba(196,214,236,0.22)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var bx = p.x + 6; bx < p.x + p.width - 22; bx += 22) {
      ctx.moveTo(bx, beamBottom);
      ctx.lineTo(bx + 22, beamBottom + 15);
      ctx.moveTo(bx + 22, beamBottom);
      ctx.lineTo(bx, beamBottom + 15);
    }
    ctx.stroke();

    ctx.fillStyle = '#7f8a99';
    ctx.fillRect(p.x, p.y, p.width, p.height);
    ctx.fillStyle = '#aab6c6';
    ctx.fillRect(p.x, p.y, p.width, 4);
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.fillRect(p.x, beamBottom - 3, p.width, 3);

    ctx.fillStyle = '#5d6775';
    for (var rx = p.x + 12; rx < p.x + p.width - 8; rx += 34) {
      ctx.fillRect(rx, p.y + 5, 3, 3);
    }
  }
}

function drawLadders() {
  var ls = level.ladders;
  if (!ls) return;
  for (var i = 0; i < ls.length; i++) {
    var l = ls[i];
    ctx.fillStyle = '#c9a227';
    ctx.fillRect(l.x, l.top, 4, l.bottom - l.top);
    ctx.fillRect(l.x + l.w - 4, l.top, 4, l.bottom - l.top);
    ctx.fillStyle = '#e8c14a';
    for (var y = l.top + 8; y < l.bottom - 2; y += 14) {
      ctx.fillRect(l.x, y, l.w, 3);
    }
  }
}

// Plain footballs, not the Giant's flaming ones -- these are rolling, not thrown.
function drawRollers() {
  for (var i = 0; i < game.rollers.length; i++) {
    var r = game.rollers[i];
    ctx.fillStyle = '#f2f2ee';
    ctx.beginPath();
    ctx.arc(r.x, r.y, ROLLER_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#20242b';
    for (var k = 0; k < 3; k++) {
      var a = r.spin + k * (Math.PI * 2 / 3);
      ctx.beginPath();
      ctx.arc(r.x + Math.cos(a) * ROLLER_R * 0.44, r.y + Math.sin(a) * ROLLER_R * 0.44,
              ROLLER_R * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(r.x, r.y, ROLLER_R, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// Rest is over the shoulder and slightly back; the strike carries it past horizontal to
// just above the feet. Both are angles from straight up, mirrored by facing at the call
// site. 1.95 rad is not a feel value: at radius 34 it puts the head 31px in front of the
// body, against SWING_REACH of 34 -- the picture and the hitbox agree. Further round and
// the hammer visibly swings through the girder it is standing on.
var HAMMER_REST = -0.55;
var HAMMER_STRIKE = 1.95;

// Drawn with an outline: at this size a flat grey head against a dark blue sky reads as a
// stray rectangle rather than as a tool. Everything is proportional to w/h, so the big
// hammer is the same drawing at twice the size.
function drawHammer(x, y, w, h) {
  var headH = h * 0.42;
  // The shaft is a fraction of the width, not a fixed 6px: at 6px the big hammer read as
  // a plate on a stick rather than as the same tool twice the size.
  var shaft = Math.max(6, w * 0.23);
  ctx.fillStyle = '#8a5a2b';
  ctx.fillRect(x + w / 2 - shaft / 2, y + headH - 2, shaft, h - headH + 2);
  ctx.fillStyle = '#5a3d1e';
  ctx.fillRect(x + w / 2 - shaft / 2, y + headH - 2, shaft / 3, h - headH + 2);
  ctx.fillStyle = '#d9dfe8';
  ctx.fillRect(x, y, w, headH);
  ctx.fillStyle = '#98a2b0';
  ctx.fillRect(x, y + headH * 0.66, w, headH * 0.34);
  ctx.strokeStyle = '#2b3444';
  ctx.lineWidth = Math.max(2, w / 13);
  ctx.strokeRect(x, y, w, headH);
}

function drawPickups() {
  for (var i = 0; i < game.pickups.length; i++) {
    var pu = game.pickups[i];
    // A slow bob, so a pickup reads as collectable rather than as scenery.
    var bob = Math.sin(game.runTime * 3 + i) * 3;
    if (pu.kind === 'bighammer') {
      // A glow behind it, because at this size against the lattice it otherwise reads as
      // one more piece of scaffold rather than as the thing you came up here for.
      var cx = pu.x + pu.w / 2, cy = pu.y + bob + pu.h / 2;
      var gl = ctx.createRadialGradient(cx, cy, 6, cx, cy, pu.w * 1.5);
      gl.addColorStop(0, 'rgba(255,220,120,0.34)');
      gl.addColorStop(1, 'rgba(255,220,120,0)');
      ctx.fillStyle = gl;
      ctx.fillRect(cx - pu.w * 1.5, cy - pu.w * 1.5, pu.w * 3, pu.w * 3);
    }
    if (pu.kind === 'hammer' || pu.kind === 'bighammer') {
      drawHammer(pu.x, pu.y + bob, pu.w, pu.h);
    }
  }
}

// --- The trophy. Drawn, like the shard, and in the same gold -- they have to read as the
// --- same object before and after, or the shatter means nothing. Outlined, because a pale
// --- shape against the floodlit bowl otherwise dissolves into it.

function drawTrophy(x, y, w, h) {
  var bowlH = h * 0.46;
  var stemH = h * 0.22;
  var baseY = y + bowlH + stemH;
  var baseH = h - bowlH - stemH;

  var gold = ctx.createLinearGradient(x, y, x + w, y + h);
  gold.addColorStop(0, '#fff3c4');
  gold.addColorStop(0.45, '#e8c14a');
  gold.addColorStop(1, '#9a7716');

  // Handles first, so the bowl overlaps where they meet it.
  ctx.strokeStyle = '#c9a227';
  ctx.lineWidth = Math.max(3, w * 0.085);
  ctx.beginPath();
  ctx.moveTo(x + w * 0.10, y + bowlH * 0.10);
  ctx.quadraticCurveTo(x - w * 0.22, y + bowlH * 0.42, x + w * 0.20, y + bowlH * 0.80);
  ctx.moveTo(x + w * 0.90, y + bowlH * 0.10);
  ctx.quadraticCurveTo(x + w * 1.22, y + bowlH * 0.42, x + w * 0.80, y + bowlH * 0.80);
  ctx.stroke();

  ctx.fillStyle = gold;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + w, y);
  ctx.lineTo(x + w * 0.68, y + bowlH);
  ctx.lineTo(x + w * 0.32, y + bowlH);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#6b5210';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = gold;
  ctx.fillRect(x + w * 0.43, y + bowlH, w * 0.14, stemH);
  ctx.fillRect(x + w * 0.24, baseY, w * 0.52, baseH * 0.55);
  ctx.fillRect(x + w * 0.14, baseY + baseH * 0.55, w * 0.72, baseH * 0.45);
  ctx.strokeRect(x + w * 0.14, baseY + baseH * 0.55, w * 0.72, baseH * 0.45);

  // One highlight down the left of the bowl, so it reads as metal rather than as a flat
  // gold shape.
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath();
  ctx.moveTo(x + w * 0.14, y + bowlH * 0.10);
  ctx.lineTo(x + w * 0.26, y + bowlH * 0.10);
  ctx.lineTo(x + w * 0.36, y + bowlH * 0.82);
  ctx.lineTo(x + w * 0.26, y + bowlH * 0.82);
  ctx.closePath();
  ctx.fill();
}

// What is left of it. Same shard shape as the collectible, at a fraction of the size --
// which is what sells the one Bert picks up as a piece of the thing that just broke.
function drawTrophyBits() {
  for (var i = 0; i < game.trophyBits.length; i++) {
    var b = game.trophyBits[i];
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, b.life / (TROPHY_BIT_LIFE * 0.5)));
    drawShardShape(b.x, b.y, b.size, b.size * 1.3, b.rot);
    ctx.restore();
  }
}

// --- The shard. One path draws it at 20px on a girder and at 200px in the close-up.

function drawShardShape(cx, cy, w, h, rot) {
  var pts = [[0, -0.5], [0.34, -0.14], [0.22, 0.5], [-0.14, 0.3], [-0.36, -0.18]];
  ctx.save();
  ctx.translate(cx, cy);
  if (rot) ctx.rotate(rot);
  var g = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
  g.addColorStop(0, '#fff8d6');
  g.addColorStop(0.45, '#e8c14a');
  g.addColorStop(1, '#8a6a12');
  ctx.beginPath();
  for (var i = 0; i < pts.length; i++) {
    var qx = pts[i][0] * w, qy = pts[i][1] * h;
    if (i === 0) ctx.moveTo(qx, qy); else ctx.lineTo(qx, qy);
  }
  ctx.closePath();
  ctx.fillStyle = g;
  ctx.fill();
  // One dark facet, so it reads as a broken solid rather than a flat sticker.
  ctx.beginPath();
  ctx.moveTo(0, -0.5 * h);
  ctx.lineTo(0.22 * w, 0.5 * h);
  ctx.lineTo(-0.14 * w, 0.3 * h);
  ctx.closePath();
  ctx.fillStyle = 'rgba(96,70,8,0.38)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,251,232,0.85)';
  ctx.lineWidth = Math.max(1, w * 0.045);
  ctx.stroke();
  ctx.restore();
}

function drawShard() {
  var sh = game.shard;
  if (!sh || sh.taken) return;
  var bob = sh.landed ? Math.sin(game.runTime * 4) * 3 : 0;
  var cx = sh.x + SHARD_W / 2;
  var cy = sh.y + SHARD_H / 2 + bob;
  var gl = ctx.createRadialGradient(cx, cy, 3, cx, cy, 34);
  gl.addColorStop(0, 'rgba(255,236,150,0.55)');
  gl.addColorStop(1, 'rgba(255,236,150,0)');
  ctx.fillStyle = gl;
  ctx.fillRect(cx - 34, cy - 34, 68, 68);
  drawShardShape(cx, cy, SHARD_W, SHARD_H, sh.landed ? 0 : game.runTime * 6);
}

// Cars, buses and barges. Bright on purpose: the road is dark, and a vehicle you cannot
// pick out of it at a glance is not a hazard, it is a trap.
var CAR_TINTS = ['#e8573f', '#f0c33c', '#4fb0e0', '#d8dde3'];

function drawTraffic() {
  for (var i = 0; i < game.traffic.length; i++) {
    var v = game.traffic[i];
    if (v.x > WORLD_W + 20 || v.x + v.w < -20) continue;
    if (v.kind === 'carrier') {
      // A barge: dark hull, pale deck, a cabin at the blunt end.
      ctx.fillStyle = '#2f2a22';
      ctx.fillRect(v.x, v.y, v.w, v.h);
      ctx.fillStyle = '#6b5a3e';
      ctx.fillRect(v.x + 4, v.y + 4, v.w - 8, v.h - 8);
      ctx.fillStyle = '#8a7550';
      for (var px = v.x + 10; px < v.x + v.w - 10; px += 22) {
        ctx.fillRect(px, v.y + 7, 14, v.h - 14);
      }
      ctx.fillStyle = '#2b4a5c';
      var cabX = v.dir > 0 ? v.x + 8 : v.x + v.w - 42;
      ctx.fillRect(cabX, v.y + 9, 34, v.h - 18);
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 2;
      ctx.strokeRect(v.x, v.y, v.w, v.h);
    } else {
      var body = v.style === 'bus' ? '#2f6fb5' : CAR_TINTS[v.tint % CAR_TINTS.length];
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.fillRect(v.x + 3, v.y + v.h - 4, v.w - 6, 6);
      ctx.fillStyle = body;
      ctx.fillRect(v.x, v.y, v.w, v.h);
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fillRect(v.x, v.y, v.w, 5);
      // Windows, and headlights at the leading end so direction reads without motion.
      ctx.fillStyle = '#16222c';
      if (v.style === 'bus') {
        for (var wx = v.x + 14; wx < v.x + v.w - 16; wx += 30) {
          ctx.fillRect(wx, v.y + 8, 20, v.h - 18);
        }
      } else {
        ctx.fillRect(v.x + v.w * 0.28, v.y + 7, v.w * 0.44, v.h - 16);
      }
      ctx.fillStyle = '#fff2b0';
      var lx = v.dir > 0 ? v.x + v.w - 6 : v.x + 2;
      ctx.fillRect(lx, v.y + 5, 4, 5);
      ctx.fillRect(lx, v.y + v.h - 10, 4, 5);
      ctx.strokeStyle = 'rgba(0,0,0,0.45)';
      ctx.lineWidth = 2;
      ctx.strokeRect(v.x, v.y, v.w, v.h);
    }
  }
}

// Power pellets. Pulsed, because on this screen they are not a bonus -- they are the only
// thing that makes any of the Frauds touchable.
function drawPellets() {
  for (var i = 0; i < game.pellets.length; i++) {
    var p = game.pellets[i];
    if (p.eaten) continue;
    var pulse = 1 + Math.sin(game.runTime * 6 + i) * 0.18;
    var gl = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, PELLET_R * 3.2);
    gl.addColorStop(0, 'rgba(255,238,150,0.5)');
    gl.addColorStop(1, 'rgba(255,238,150,0)');
    ctx.fillStyle = gl;
    ctx.fillRect(p.x - PELLET_R * 3.2, p.y - PELLET_R * 3.2, PELLET_R * 6.4, PELLET_R * 6.4);
    ctx.fillStyle = '#ffe07a';
    ctx.beginPath();
    ctx.arc(p.x, p.y, PELLET_R * pulse, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawGoalposts() {
  var plats = level.platforms;
  for (var i = 0; i < plats.length; i++) {
    var p = plats[i];
    var postTop = p.y + p.height;
    var postHeight = 26;

    ctx.strokeStyle = 'rgba(255,255,255,0.32)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var nx = p.x + 18; nx < p.x + p.width - 18; nx += 11) {
      ctx.moveTo(nx, postTop);
      ctx.lineTo(nx + 9, postTop + postHeight - 4);
    }
    for (var ny = postTop; ny < postTop + postHeight - 4; ny += 8) {
      ctx.moveTo(p.x + 18, ny);
      ctx.lineTo(p.x + p.width - 18, ny);
    }
    ctx.stroke();

    ctx.fillStyle = '#e6e6e6';
    ctx.fillRect(p.x + 10, postTop, 7, postHeight);
    ctx.fillRect(p.x + p.width - 17, postTop, 7, postHeight);

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(p.x, p.y, p.width, p.height);
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(p.x, p.y + p.height - 4, p.width, 4);
  }
}

// The level clock, top right, as a number: the player is doing arithmetic against it,
// and a bar is the wrong shape for that. Red under ten.
function drawClock() {
  var secs = Math.max(0, Math.ceil(game.levelClock));
  var late = secs <= 10;
  ctx.fillStyle = 'rgba(6,14,28,0.78)';
  ctx.fillRect(CANVAS_WIDTH - 124, 10, 112, 46);
  ctx.strokeStyle = late ? '#da291c' : '#6cabdd';
  ctx.lineWidth = 2;
  ctx.strokeRect(CANVAS_WIDTH - 124, 10, 112, 46);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold 30px "Courier New", monospace';
  ctx.fillStyle = late ? '#ff5a4a' : '#ffffff';
  var m = Math.floor(secs / 60), s = secs % 60;
  ctx.fillText(m + ':' + (s < 10 ? '0' : '') + s, CANVAS_WIDTH - 68, 17);
  ctx.textAlign = 'left';
}

function drawHUD() {
  ctx.fillStyle = 'rgba(6,14,28,0.78)';
  ctx.fillRect(12, 10, 250, 78);
  ctx.strokeStyle = '#6cabdd';
  ctx.lineWidth = 2;
  ctx.strokeRect(12, 10, 250, 78);

  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold 20px "Courier New", monospace';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(level.name, 24, 20);
  if (level.clock) drawClock();

  // Five icons run from x=24 at a 26px pitch and end at 150; the label starts at 158, so a
  // sixth would collide. Past five, one icon and a count.
  var s = HEAD_SRC.bert;
  var iconW = 22;
  var iconH = iconW * (s.sh / s.sw);
  var ready = s.img.complete && s.img.naturalWidth;
  if (game.lives <= 5) {
    for (var i = 0; i < game.lives; i++) {
      if (ready) ctx.drawImage(s.img, s.sx, s.sy, s.sw, s.sh, 24 + i * (iconW + 4), 46, iconW, iconH);
    }
  } else {
    if (ready) ctx.drawImage(s.img, s.sx, s.sy, s.sw, s.sh, 24, 46, iconW, iconH);
    ctx.font = 'bold 18px "Courier New", monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('x' + game.lives, 24 + iconW + 6, 50);
  }

  // Said on screen, always. An invulnerable run that looks like an ordinary one is how a
  // tester ends up reporting that the footballs are broken.
  if (game.invuln) {
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillStyle = '#7cfc9a';
    ctx.fillText('INVULNERABLE', 24, 74);
  }

  ctx.font = 'bold 13px "Courier New", monospace';
  ctx.fillStyle = '#a8d4ef';
  if (level.hud && level.hud.label) {
    // Once he has gone the tally is stale -- the thing left to do is on the floor.
    var tally = (game.shard && !game.shard.taken) ? 'SHARD'
              : (level.hud.kind === 'boss-hits' && game.giant)
                ? (game.giant.hitsTaken + '/' + level.boss.hits)
                : (game.giantSpawned ? 'GIANT' : game.minisLeft);
    // Top of the right-hand column: the bars below it start at y=62, and at y=56 this
    // sat straight on top of them.
    ctx.fillText(level.hud.label + ': ' + tally, 158, 44);
  }

  // Armed. The bar is the ordinary hammer burning down; the big one has no timer, so it
  // gets a word instead -- an empty bar there would read as "about to run out".
  // Second row, right of the lives: the top line is the level name, which on a 12-letter
  // screen already runs to x=168.
  // One bar per screen, under the tally, so it never needs a word of its own: on the
  // Crossing it is the clock, in the maze it is the power. Colour carries the urgency.
  if (level.engine === 'topdown') {
    var frac = Math.max(0, game.crossTimer / tune('crossTime', CROSS_TIME));
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillRect(158, 62, 88, 9);
    // Red in the last quarter: a clock you cannot see running out is just an ambush.
    ctx.fillStyle = frac < 0.25 ? '#da291c' : '#e8c14a';
    ctx.fillRect(158, 62, 88 * frac, 9);
  } else if (level.engine === 'maze' && bert.powered > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillRect(158, 62, 88, 9);
    ctx.fillStyle = '#ffe07a';
    ctx.fillRect(158, 62, 88 * Math.max(0, bert.powered / POWER_TIME), 9);
  } else if (level.engine === 'mode7') {
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillRect(158, 62, 88, 9);
    if (bert.boost > 0) {
      ctx.fillStyle = '#ff9a2a';
      ctx.fillRect(158, 62, 88 * (bert.boost / BOOST_TIME), 9);
    } else if (bert.boostCool > 0) {
      ctx.fillStyle = '#5c6672';
      ctx.fillRect(158, 62, 88 * (1 - bert.boostCool / BOOST_COOLDOWN), 9);
    } else {
      ctx.fillStyle = '#6cabdd';
      ctx.fillRect(158, 62, 88, 9);
    }
    // The football, if he is carrying one. There is only ever one, so it is a dot and a
    // word rather than a count.
    if (bert.football > 0) {
      ctx.fillStyle = '#f2f2f2';
      ctx.beginPath();
      ctx.arc(164, 82, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = 'bold 12px "Courier New", monospace';
      ctx.fillStyle = '#ffe07a';
      ctx.fillText('DOWN TO THROW', 174, 76);
    }
  } else if (bert.bigHammer > 0) {
    drawHammer(160, 46, 14, 20);
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.fillStyle = '#ffe07a';
    ctx.fillText('BIG HAMMER', 180, 52);
  } else if (bert.hammer > 0) {
    drawHammer(160, 46, 13, 19);
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillRect(180, 52, 66, 8);
    ctx.fillStyle = '#e8c14a';
    ctx.fillRect(180, 52, 66 * Math.max(0, bert.hammer / HAMMER_TIME), 8);
  }
}

// Hint text: one line, high enough to clear the HUD, gone within a few seconds and
// faded out over the last one so it never sits there competing with the game.
function drawHint() {
  if (!game.hint || game.hintTimer <= 0) return;
  ctx.save();
  ctx.globalAlpha = Math.min(1, game.hintTimer);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 19px "Courier New", monospace';
  // Measured, not fixed: hint copy is level data, and a fixed box clips the first line
  // that outgrows it. Courier is monospace, so the fallback estimate is close enough.
  var tw = ctx.measureText ? ctx.measureText(game.hint).width : game.hint.length * 11.4;
  ctx.fillStyle = 'rgba(4,10,22,0.72)';
  ctx.fillRect(CANVAS_WIDTH / 2 - tw / 2 - 16, 96, tw + 32, 30);
  ctx.fillStyle = '#ffe07a';
  ctx.fillText(game.hint, CANVAS_WIDTH / 2, 112);
  ctx.restore();
}

// The close-up. A white-out on the pickup, then the piece of the trophy held up on its
// own -- the first beat of the cut-scene template in DESIGN.md.
function drawShardCard() {
  var flash = game.shardTimer - SHARD_CARD_TIME;
  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, flash / SHARD_FLASH) + ')';
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    return;
  }
  ctx.fillStyle = 'rgba(4,10,22,0.94)';
  ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

  var cx = CANVAS_WIDTH / 2;
  var cy = 330;
  // Grows into place over the first third of the card, so it lands rather than appears.
  var age = SHARD_CARD_TIME - game.shardTimer;
  var pop = Math.min(1, age / 0.45);
  var scale = 0.6 + pop * 0.4;

  // A slow turning burst behind it. Thin, and faded out to nothing at the rim: at the
  // first attempt these were solid 30px bars and the card read as a windmill.
  var glow = ctx.createRadialGradient(cx, cy, 10, cx, cy, 330);
  glow.addColorStop(0, 'rgba(232,193,74,0.30)');
  glow.addColorStop(1, 'rgba(232,193,74,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(cx - 330, cy - 330, 660, 660);

  var rays = 10;
  var ray = ctx.createRadialGradient(cx, cy, 10, cx, cy, 320);
  ray.addColorStop(0, 'rgba(255,231,150,0.34)');
  ray.addColorStop(1, 'rgba(255,231,150,0)');
  ctx.fillStyle = ray;
  for (var i = 0; i < rays; i++) {
    var a = age * 0.5 + i * (Math.PI * 2 / rays);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a - 0.022) * 320, cy + Math.sin(a - 0.022) * 320);
    ctx.lineTo(cx + Math.cos(a + 0.022) * 320, cy + Math.sin(a + 0.022) * 320);
    ctx.closePath();
    ctx.fill();
  }

  drawShardShape(cx, cy, 150 * scale, 195 * scale, Math.sin(age * 1.6) * 0.12);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 30px "Courier New", monospace';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(level.shard.copy || 'A PIECE OF THE TROPHY', cx, 96);
  ctx.font = 'bold 22px "Courier New", monospace';
  ctx.fillStyle = '#e8c14a';
  ctx.fillText('SHARD ' + level.shard.n + ' OF 6', cx, 136);
}

// Laid out from a real running total. The original stepped by `i * (sizes[i] + 18)`,
// which uses the CURRENT line's size to space every line before it -- fine while the
// first line was always the largest, but a 56px title followed by a 24px subtitle put the
// subtitle on top of the title. Empty strings are skipped so an absent subtitle leaves no
// hole.
// Row geometry, shared by drawMenu() and the click hit-test. The hit box is the full row
// pitch rather than the drawn box: the drawn box is 46 logical px, which on a landscape
// phone is only about 28 CSS px tall -- under any sane tap target.
var MENU_TOP = 196;
var MENU_PITCH = 58;
function menuRowRect(i, forHit) {
  var h = forHit ? MENU_PITCH : 46;
  return { x: 210, y: MENU_TOP + i * MENU_PITCH - h / 2, w: 540, h: h };
}

function menuRowAt(x, y) {
  for (var i = 0; i < MENU.length; i++) {
    var r = menuRowRect(i, true);
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return i;
  }
  return -1;
}

function drawMenu() {
  ctx.fillStyle = 'rgba(4,10,22,0.9)';
  ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 58px "Courier New", monospace';
  ctx.fillStyle = '#6cabdd';
  ctx.fillText('DONKEY YONG', CANVAS_WIDTH / 2, 86);
  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillStyle = '#7f93ab';
  ctx.fillText('ALPHA BUILD  \u00B7  ' + LEVELS.length + ' OF 7 SCREENS BUILT',
    CANVAS_WIDTH / 2, 128);

  for (var i = 0; i < MENU.length; i++) {
    var m = MENU[i];
    var y = MENU_TOP + i * MENU_PITCH;
    var on = (i === game.menuIndex);
    var box = menuRowRect(i, false);
    // Every row gets a border, not just the selected one -- an unbordered row does not
    // read as clickable, which is exactly how a click on it gets mistaken for a miss.
    ctx.strokeStyle = on ? '#6cabdd' : 'rgba(108,171,221,0.28)';
    ctx.lineWidth = on ? 2 : 1;
    if (on) {
      ctx.fillStyle = 'rgba(108,171,221,0.15)';
      ctx.fillRect(box.x, box.y, box.w, box.h);
    }
    ctx.strokeRect(box.x, box.y, box.w, box.h);
    if (on) {
      ctx.textAlign = 'center';
      ctx.font = 'bold 20px "Courier New", monospace';
      ctx.fillStyle = '#6cabdd';
      ctx.fillText('\u25B6', 232, y - 1);
    }
    ctx.textAlign = 'left';
    ctx.font = 'bold 22px "Courier New", monospace';
    ctx.fillStyle = on ? '#ffffff' : '#8ea6bf';
    ctx.fillText(m.label, 258, y - 7);
    if (m.kind === 'toggle') {
      ctx.textAlign = 'right';
      ctx.fillStyle = game.invuln ? '#7cfc9a' : '#7f93ab';
      ctx.fillText(game.invuln ? 'ON' : 'OFF', box.x + box.w - 18, y - 7);
      ctx.textAlign = 'left';
    }
    if (m.sub) {
      ctx.font = '12px "Courier New", monospace';
      ctx.fillStyle = on ? '#a8d4ef' : '#5d7086';
      ctx.fillText(m.sub, 258, y + 13);
    }
  }

  // Stated on the page rather than only in the docs: nothing else is built, and a tester
  // opening this should not go looking for screens or scenes that do not exist.
  //
  // Derived from LEVELS, like the rows above it. It was hardcoded as "SCREENS 2-6" when
  // only two existed and was still saying that three screens later -- a stale line on the
  // one page whose whole job is to say honestly what is here.
  var footY = MENU_TOP + MENU.length * MENU_PITCH + 22;
  ctx.textAlign = 'center';
  ctx.font = '13px "Courier New", monospace';
  ctx.fillStyle = '#6b7d92';
  ctx.fillText('NO CUT SCENES BUILT YET  \u00B7  ' + missingScreens(), CANVAS_WIDTH / 2, footY);
  ctx.font = 'bold 15px "Courier New", monospace';
  ctx.fillStyle = '#a8d4ef';
  ctx.fillText(isTouch ? 'TAP a row, or UP / DOWN then JUMP'
                       : 'CLICK a row, or UP / DOWN then SPACE',
    CANVAS_WIDTH / 2, footY + 30);
}

function panel(lines, colors, sizes) {
  ctx.fillStyle = 'rgba(4,10,22,0.82)';
  ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  var GAP = 18;
  var total = 0;
  var i;
  for (i = 0; i < lines.length; i++) {
    if (!lines[i]) continue;
    total += sizes[i] + (total ? GAP : 0);
  }
  var y = CANVAS_HEIGHT / 2 - total / 2 - 20;
  for (i = 0; i < lines.length; i++) {
    if (!lines[i]) continue;
    y += sizes[i] / 2;
    ctx.font = 'bold ' + sizes[i] + 'px "Courier New", monospace';
    ctx.fillStyle = colors[i];
    ctx.fillText(lines[i], CANVAS_WIDTH / 2, y);
    y += sizes[i] / 2 + GAP;
  }
}

function render() {
  if (!bgBuilt) buildBackground();
  ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
  ctx.drawImage(bgCanvas, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

  if (game.state === STATE.LOADING) {
    panel(['LOADING...'], ['#ffffff'], [34]);
    return;
  }

  // The one screen that scrolls draws its own world every frame: the backdrop above holds
  // only the sky and the city under the deck, because a background is baked once.
  if (level.engine === 'mode7') drawRoad();

  drawLadders();                 // behind the girders, so a ladder head reads as attached
  drawPlatforms();
  if (level.engine === 'topdown') drawTraffic();
  if (level.engine === 'maze') drawPellets();
  drawPickups();
  if (level.engine === 'mode7') {
    // Sorted by distance rather than by array order, and Bert is in the same sort as
    // everything else -- on a road, what is in front of what is the whole picture.
    if (game.plunge) drawPlunge();
    else if (game.state !== STATE.START) drawMode7Cast();
  } else {
    for (var i = 0; i < game.frauds.length; i++) drawEntity(game.frauds[i]);
    if (game.state !== STATE.START) drawEntity(bert);
  }
  if (level.engine !== 'mode7') drawBalls();
  drawRollers();
  drawTrophyBits();
  drawShard();
  if (level.engine === 'mode7' && game.state !== STATE.START) drawBlackout();
  // The landing page is not in a run: a lives count and a Fraud tally are noise there.
  if (game.state !== STATE.START && game.state !== STATE.SHARD) drawHUD();

  if (game.bannerTimer > 0 && game.state !== STATE.VICTORY && game.state !== STATE.SHARD) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 40px "Courier New", monospace';
    ctx.fillStyle = '#da291c';
    ctx.fillText('GIANT FRAUD APPEARS!', CANVAS_WIDTH / 2 + 3, 163);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('GIANT FRAUD APPEARS!', CANVAS_WIDTH / 2, 160);
  }

  if (game.state === STATE.PLAYING || game.state === STATE.RESPAWNING) drawHint();

  if (game.state === STATE.START) {
    drawMenu();
  } else if (game.state === STATE.SHARD) {
    drawShardCard();
  } else if (game.state === STATE.LEVEL_INTRO) {
    panel(
      ['LEVEL ' + game.levelIndex, level.name, level.subtitle || ''],
      ['#a8d4ef', '#6cabdd', '#a8d4ef'],
      [22, 52, 20]
    );
  } else if (game.state === STATE.LEVEL_COMPLETE) {
    panel(
      [(level.copy && level.copy.complete) || (level.name + ' CLEARED'),
       level.shard ? 'SHARD ' + level.shard.n + ' OF 6' : ''],
      ['#6cabdd', '#ffffff'],
      [44, 24]
    );
  } else if (game.state === STATE.GAME_OVER) {
    panel(['GAME OVER', 'The Fraud lives to fight another day.'], ['#da291c', '#ffffff'], [64, 22]);
  } else if (game.state === STATE.VICTORY) {
    panel(
      ['Bert Yong Forever!!', 'Manchester is Blue!!'],
      ['#6cabdd', '#ffffff'],
      [56, 48]
    );
  }
}

// --- Loop

var lastTime = 0;
function loop(ts) {
  if (!lastTime) lastTime = ts;
  var dt = (ts - lastTime) / 1000;
  lastTime = ts;
  if (dt > 0.05) dt = 0.05;   // clamp: no tunnelling after a backgrounded tab

  // Portrait pauses the simulation but keeps rendering, so the frame behind the
  // rotate overlay stays current and nothing moves while the player turns the phone.
  if (!paused) update(dt);
  render();
  requestAnimationFrame(loop);
}

// --- Input

function pressJump() {
  initAudio();
  if (game.state === STATE.START) {
    menuSelect();
    return;
  }
  if (game.state !== STATE.PLAYING || bert.dying) return;
  // On a kart JUMP is the boost, on its own cooldown. It is the only other thing the
  // screen asks of the button, and there is nothing to jump over.
  if (level.engine === 'mode7') {
    if (bert.boost > 0 || bert.boostCool > 0 || bert.spinOut > 0) return;
    bert.boost = BOOST_TIME;
    sfx.boost();
    return;
  }
  if (bert.grounded) {
    bert.vy = BERT_JUMP_V;
    bert.grounded = false;
    sfx.jump();
  }
}

window.addEventListener('keydown', function (e) {
  if (e.code === 'ArrowLeft' || e.code === 'ArrowRight' ||
      e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'Space') e.preventDefault();
  if (e.code === 'ArrowLeft') { keys.left = true; if (!e.repeat) pressHop(-1, 0); }
  if (e.code === 'ArrowRight') { keys.right = true; if (!e.repeat) pressHop(1, 0); }
  if (e.code === 'ArrowUp') { keys.up = true; if (!e.repeat) { menuMove(-1); pressHop(0, -1); } }
  if (e.code === 'ArrowDown') { keys.down = true; if (!e.repeat) { menuMove(1); pressDown(); pressHop(0, 1); } }
  if (e.code === 'Space' && !e.repeat) pressJump();
  if (e.code === 'KeyM') { muted = !muted; }
  if (e.code === 'KeyI' && !e.repeat) { game.invuln = !game.invuln; }
});
window.addEventListener('keyup', function (e) {
  if (e.code === 'ArrowLeft') keys.left = false;
  if (e.code === 'ArrowRight') keys.right = false;
  if (e.code === 'ArrowUp') keys.up = false;
  if (e.code === 'ArrowDown') keys.down = false;
});
window.addEventListener('blur', function () { releaseAll(); bert.vx = 0; });

// --- Touch. Pointer ids are tracked by hand instead of using per-button up/down,
// because touch implicitly captures the pointer to whichever element it started on.
// That capture is what made the old buttons feel broken: sliding a thumb from the left
// pad to the right pad never switched direction, and lifting a finger away from the pad
// it started on left that direction held down. Releasing the capture and hit-testing on
// every move fixes both, and gives real multitouch -- a direction and JUMP at once.

var PADS = { leftBtn: 'left', rightBtn: 'right', upBtn: 'up', downBtn: 'down', jumpBtn: 'jump' };
var held = {};   // pointerId -> pad element id

function padAt(x, y) {
  if (!document.elementFromPoint) return null;
  var el = document.elementFromPoint(x, y);
  return el && PADS[el.id] ? el.id : null;
}

// A pad id maps to exactly one held key; jump is an edge, not a hold.
var PAD_KEY = { leftBtn: 'left', rightBtn: 'right', upBtn: 'up', downBtn: 'down' };

function assign(pointerId, padId) {
  var prev = held[pointerId] || null;
  if (prev === padId) return;
  if (prev && PAD_KEY[prev]) keys[PAD_KEY[prev]] = false;
  if (padId) held[pointerId] = padId; else delete held[pointerId];
  if (padId && PAD_KEY[padId]) keys[PAD_KEY[padId]] = true;
  if (padId === 'leftBtn') pressHop(-1, 0);
  if (padId === 'rightBtn') pressHop(1, 0);
  if (padId === 'upBtn') { menuMove(-1); pressHop(0, -1); }
  if (padId === 'downBtn') { menuMove(1); pressDown(); pressHop(0, 1); }
  if (padId === 'jumpBtn') pressJump();
}

function releaseAll() {
  held = {};
  keys.left = keys.right = keys.up = keys.down = false;
}

function bindPad(id) {
  var el = document.getElementById(id);
  if (!el || !el.addEventListener) return;
  el.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    initAudio();
    requestWakeLock();
    if (el.hasPointerCapture && el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId);
    assign(e.pointerId, id);
  });
}
bindPad('leftBtn');
bindPad('rightBtn');
bindPad('upBtn');
bindPad('downBtn');
bindPad('jumpBtn');

window.addEventListener('pointermove', function (e) {
  if (!held[e.pointerId]) return;
  e.preventDefault();
  assign(e.pointerId, padAt(e.clientX, e.clientY));
});
window.addEventListener('pointerup', function (e) { assign(e.pointerId, null); });
window.addEventListener('pointercancel', function (e) { assign(e.pointerId, null); });

function canvasPoint(e) {
  if (!canvas.getBoundingClientRect) return null;
  var r = canvas.getBoundingClientRect();
  if (!r.width || !r.height) return null;
  return {
    x: (e.clientX - r.left) / r.width * CANVAS_WIDTH,
    y: (e.clientY - r.top) / r.height * CANVAS_HEIGHT
  };
}

canvas.addEventListener('pointerdown', function (e) {
  initAudio();
  requestWakeLock();
  if (game.state !== STATE.START) return;
  var p = canvasPoint(e);
  var row = p ? menuRowAt(p.x, p.y) : -1;
  if (row < 0) return;      // a miss does nothing: launching the highlighted row on a
                            // near-miss is what made clicking THE SCAFFOLD start level 0
  game.menuIndex = row;
  menuSelect();
});

// pointerdown rather than click: no tap delay, and it matches the pads.
// Back to the menu rather than straight into another run: in alpha the point is to pick
// a screen, not to replay from the top.
restartBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); initAudio(); toMenu(); });

// --- Viewport. One function owns both the on-screen size of the stage and the backing
// store resolution. The game is authored in 960x640 logical units and a single base
// transform maps those onto however many device pixels we actually got, so no game or
// draw code has to know the difference. Assigning canvas.width wipes context state,
// which is why the transform is re-installed here every time.

function fitStage() {
  var vv = window.visualViewport;
  var vw = (vv && vv.width) || window.innerWidth || CANVAS_WIDTH;
  var vh = (vv && vv.height) || window.innerHeight || CANVAS_HEIGHT;
  // A phone wants every pixel; a desktop window looks unfinished with the frame
  // bleeding off the edges, so leave it a little room.
  var edge = isTouch ? 0 : 16;
  var scale = Math.min((vw - edge) / CANVAS_WIDTH, (vh - edge) / CANVAS_HEIGHT);
  var w = Math.max(1, Math.floor(CANVAS_WIDTH * scale));
  var h = Math.max(1, Math.floor(CANVAS_HEIGHT * scale));
  if (wrap && wrap.style) {
    wrap.style.width = w + 'px';
    wrap.style.height = h + 'px';
  }

  var dpr = Math.min(window.devicePixelRatio || 1, 2);   // past 2x the gain is invisible
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  var s = canvas.width / CANVAS_WIDTH;
  ctx.setTransform(s, 0, 0, s, 0, 0);

  bgCanvas.width = canvas.width;
  bgCanvas.height = canvas.height;
  bgBuilt = false;                    // rebuild it at the new resolution
}

function syncOrientation() {
  if (!document.body || !document.body.classList) return;
  var portrait = !!(window.matchMedia && window.matchMedia('(orientation: portrait)').matches);
  paused = isTouch && portrait;
  document.body.classList.toggle('portrait-block', paused);
  if (paused) releaseAll();
}

function onViewportChange() { fitStage(); syncOrientation(); }

window.addEventListener('resize', onViewportChange);
window.addEventListener('orientationchange', onViewportChange);
document.addEventListener('fullscreenchange', onViewportChange);
if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', onViewportChange);
}

// --- Fullscreen. Worth a button on Android, where it also lets us lock landscape and
// takes the URL and nav bars with it. iPhone Safari supports neither, so it stays hidden
// there and the rotate prompt does that job instead.

var fsBtn = document.getElementById('fsBtn');
var docEl = document.documentElement;
if (fsBtn && isTouch && docEl && docEl.requestFullscreen && document.body && document.body.classList) {
  document.body.classList.add('show-fs');
  fsBtn.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (document.fullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen();
      return;
    }
    var entering = docEl.requestFullscreen();
    if (entering && entering.then) {
      entering.then(function () {
        try {
          if (typeof screen !== 'undefined' && screen.orientation && screen.orientation.lock) {
            var locked = screen.orientation.lock('landscape');
            if (locked && locked.catch) locked.catch(function () {});
          }
        } catch (err) { /* no orientation lock here; the rotate prompt covers it */ }
      }).catch(function () {});
    }
  });
}

// --- Wake lock, so the screen does not dim mid-fight. The lock is dropped whenever the
// tab is backgrounded, hence the re-request when it comes back.

var wakeLock = null;
function requestWakeLock() {
  if (typeof navigator === 'undefined' || !navigator.wakeLock || wakeLock) return;
  try {
    navigator.wakeLock.request('screen').then(function (l) {
      wakeLock = l;
      if (l.addEventListener) l.addEventListener('release', function () { wakeLock = null; });
    }).catch(function () {});
  } catch (err) { /* unsupported */ }
}

document.addEventListener('visibilitychange', function () {
  if (document.hidden) { releaseAll(); bert.vx = 0; }
  else { requestWakeLock(); }
});

// --- Boot. The head photos are required; the stadium photo is optional and the drawn
// --- stadium stands in for it, so the game never blocks on it.

var required = 2;
var loaded = 0;
function assetLoaded() {
  loaded++;
  if (loaded >= required) game.state = STATE.START;
}
bertHeadImg.onload = assetLoaded;
fraudHeadImg.onload = assetLoaded;
bertHeadImg.onerror = function () { console.error('Failed to load bert.png'); assetLoaded(); };
fraudHeadImg.onerror = function () { console.error('Failed to load fraud.png'); assetLoaded(); };
bertHeadImg.src = 'bert.png';
fraudHeadImg.src = 'fraud.png';

fitStage();
syncOrientation();

requestAnimationFrame(loop);
</script>
</body>
</html>
