  var gb = bodyRect(CHAR_DEFS[level.boss.form], 0, 0);
  var sp = level.boss.spawn;
  // With no fixed spawn, arrive on whichever side is further from Bert, so it can never
  // materialise on top of him and cost a life for free.
  var x = sp ? sp.x : ((bert.x > WORLD_W / 2) ? 60 : WORLD_W - 60 - gb.w);
  game.giant = makeGiant(x);
  if (sp && sp.y !== undefined) { game.giant.y = sp.y; game.giant.grounded = true; }
  // Mode 7: he arrives a fixed distance up the road rather than at a screen position, and
  // his weave and his return fire start from there.
  if (sp && sp.ahead !== undefined) {
    game.giant.z = bertZ() + sp.ahead;
    game.giant.roadX = roadCentre(game.giant.z) + (sp.roadX || 0);
    game.giant.oilTimer = OIL_INTERVAL[0];
    game.giant.throwTimer = LOB_INTERVAL[0];
    // Item boxes start ahead of him, not at the origin: the supply is laid down from here
    // forward, and seeding it from z=0 would spawn a hundred of them behind the camera.
    game.boxNext = bertZ() + 420;
  }
  game.frauds.push(game.giant);
  game.giantSpawned = true;
  if (silent) return;
  game.bannerTimer = GIANT_ENTRY;
  bert.invincible = Math.max(bert.invincible, GIANT_ENTRY);
  sfx.giantEnter();
}

// --- Update

// The closing beats, and every engine ends with them: carry the shard along, test the
// objective, and run the victory delay down into the hand-off. One copy, not one per
// engine -- they had already been written out three times and the next screen would have
// made it four.
//
// Returns true when the caller must return immediately: the state has changed underneath
// it and the rest of its frame is operating on a screen that is no longer running.
function resolveEnding(dt) {
  updateShard(dt);
  if (game.victoryTimer <= 0) {
    if (objectiveMet()) { completeObjective(); return true; }
    return false;
  }
  game.victoryTimer -= dt;
  if (game.victoryTimer <= 0) { finishLevel(); return true; }
  return false;
}


// THE CROSSING's whole update. It shares the shell -- run clock, shard, objective, the
// ending -- and none of the platformer: no gravity, no contact loop, no stomp.
function updateCrossing(dt) {
  game.runTime += dt;
  if (game.hintTimer > 0) game.hintTimer -= dt;
  if (bert.invincible > 0) bert.invincible -= dt;
  updateTraffic(dt);
  // The clock. It runs only while a crossing is live -- once he has fled there is nothing
  // left to be late for, and being timed out while walking to the shard would be absurd.
  if (!bert.dying && !game.shard && game.victoryTimer <= 0) {
    game.crossTimer -= dt;
    if (game.crossTimer <= 0) {
      game.crossTimer = 0;
      if (bert.invincible <= 0) { killBert(); return; }
    }
  }
  for (var i = 0; i < game.frauds.length; i++) {
    var f = game.frauds[i];
    if (f.escaping) integrateEscape(f, dt);
    else if (f.type !== 'bert') f.facing = (bert.x < f.x) ? -1 : 1;
  }

  if (bert.hopT > 0) {
    bert.hopT -= dt;
    var t = 1 - Math.max(0, bert.hopT) / HOP_TIME;
    bert.x = bert.hopFromX + (bert.hopToX - bert.hopFromX) * t;
    bert.y = bert.hopFromY + (bert.hopToY - bert.hopFromY) * t;
    if (bert.hopT <= 0) { bert.hopT = 0; bert.x = bert.hopToX; bert.y = bert.hopToY; }
  }

  // Hazards are resolved on landing, never mid-hop. The original checks what you came
  // down on rather than what you passed over, and at 0.13s the grace is too short to
  // exploit but long enough that a hop reads as committed.
  if (!bert.dying && bert.hopT <= 0) {
    var row = levelRows()[bert.row];
    var b = bodyOf(bert);
    if (row.kind === 'water') {
      var car = carrierUnder(bert);
      if (car) {
        bert.x += car.dir * car.speed * dt;
        // Carried off the edge is a death, not a wall to lean on -- clamping him there
        // would make the far ends of the canal the safest places on the screen.
        if (bert.x + b.w < 0 || bert.x > WORLD_W) { killBert(); return; }
      } else if (bert.invincible <= 0) {
        sfx.ballBurst();
        killBert();
        return;
      }
    } else if (row.kind === 'road' && bert.invincible <= 0) {
      for (var v = 0; v < game.traffic.length; v++) {
        var veh = game.traffic[v];
        if (veh.kind !== 'car' || veh.row !== bert.row) continue;
        if (overlaps(b, veh)) { killBert(); return; }
      }
    }
    if (bert.row === 0 && game.giant && !game.giant.escaping &&
        !game.shard && game.victoryTimer <= 0) landCrossing();
  }

  if (resolveEnding(dt)) return;
}

// THE CONCOURSE. Five Minis to eat while powered, then he shows up, and catching him
// while powered is what corners him. He is never depleted -- boss.hits is 0, as on the
// Scaffold -- he simply cannot stay.
function updateConcourse(dt) {
  game.runTime += dt;
  if (game.hintTimer > 0) game.hintTimer -= dt;
  if (bert.invincible > 0) bert.invincible -= dt;
  if (bert.powered > 0) bert.powered -= dt;

  // Held keys, not press edges: a maze wants you to hold a direction into a turn and take
  // it the moment it opens, which is exactly what `want` surviving until it fits does.
  if (keys.up) bert.want = MAZE_DIRS[2];
  else if (keys.down) bert.want = MAZE_DIRS[3];
  else if (keys.left) bert.want = MAZE_DIRS[0];
  else if (keys.right) bert.want = MAZE_DIRS[1];
  if (!bert.dying) mazeMove(bert, dt, PAC_SPEED);

  mazeField();                    // one flood fill a frame, shared by everything hunting
  var i, f;
  for (i = 0; i < game.frauds.length; i++) {
    f = game.frauds[i];
    if (f.escaping) { integrateEscape(f, dt); continue; }
    if (f.dying) { f.deathTimer += dt; f.spin += dt * 9; continue; }
    mazeThink(f, dt);
    mazeMove(f, dt, f.type === 'mini' ? MAZE_MINI_SPEED : MAZE_FRAUD_SPEED);
  }

  var bb = bodyOf(bert);

  // Pellets come back on a timer, but never underneath the player. Standing on the
  // respawn point and collecting it the instant it returns is the camp this screen had to
  // lose; a pellet whose timer is up with Bert still on top of it simply waits until he
  // moves off. Leaving and coming back is a hop -- it costs nothing except that you have
  // to be somewhere else when the swarm arrives, which is the whole point.
  for (var pi = 0; pi < game.pellets.length; pi++) {
    var pc = game.pellets[pi];
    if (!pc.eaten) continue;
    if (pc.cool > 0) pc.cool -= dt;
    if (pc.cool > 0) continue;
    pc.cool = 0;
    if (circleHitsRect(pc.x, pc.y, PELLET_R + 4, bb)) continue;
    pc.eaten = false;
  }

  if (!bert.dying) {
    for (i = 0; i < game.pellets.length; i++) {
      var pel = game.pellets[i];
      if (pel.eaten || !circleHitsRect(pel.x, pel.y, PELLET_R + 4, bb)) continue;
      pel.eaten = true;
      pel.cool = PELLET_RESPAWN;
      bert.powered = POWER_TIME;
      showHint(HINTS.pellet);
      sfx.pickup();
    }

    for (i = 0; i < game.frauds.length; i++) {
      f = game.frauds[i];
      if (f.dying || f.escaping || !overlaps(bb, bodyOf(f))) continue;
      if (f.type === 'mini') {
        if (bert.powered > 0) {
          f.dying = true; f.deathTimer = 0; f.spin = 0;
          game.minisLeft--;
          sfx.stomp();
          if (game.minisLeft <= 0 && !game.giantSpawned) {
            spawnGiant(true);
            showHint(HINTS.cornered);
          }
        } else if (bert.invincible <= 0) { killBert(); return; }
      } else if (bert.powered > 0 && level.boss.routedBy === 'powered') {
        fraudFlees(f);
      } else if (level.boss.contactDamage && bert.invincible <= 0) { killBert(); return; }
    }
  }

  for (i = game.frauds.length - 1; i >= 0; i--) {
    if (game.frauds[i].dying && game.frauds[i].deathTimer > DEATH_ANIM) game.frauds.splice(i, 1);
  }

  if (resolveEnding(dt)) return;
}

// THE MANCUNIAN WAY. Everything here is resolved in road space -- a lateral offset from
// the centreline and a distance along it -- because in road space the road is straight.
// Screen coordinates are a projection of that, and only the shard, the HUD and the plunge
// ever speak them.
function updateMancunian(dt) {
  game.runTime += dt;
  if (game.hintTimer > 0) game.hintTimer -= dt;
  if (bert.invincible > 0) bert.invincible -= dt;

  // Once he goes over the edge the screen stops being a driving game and becomes the
  // ending. Nothing below runs.
  if (game.plunge) {
    updatePlunge(dt);
    projectPlunge();
    if (resolveEnding(dt)) return;
    return;
  }

  // The clock, before anything moves: if it runs out this frame the frame is over.
  tickClock(dt);
  if (game.state !== STATE.PLAYING) return;

  if (updateKartBert(dt)) return;
  updateKartMinis(dt);
  if (game.giant && !game.giant.escaping && !game.giant.dying) {
    if (updateKartGiant(dt)) return;   // the fight is over; the screen is the ending now
  }
  updateBoxes(dt);
  if (updateOil(dt)) return;
  if (updateKartBalls(dt)) return;

  for (var k = game.frauds.length - 1; k >= 0; k--) {
    if (game.frauds[k].dying && game.frauds[k].deathTimer > DEATH_ANIM) game.frauds.splice(k, 1);
  }

  projectCast();
  if (resolveEnding(dt)) return;
}

function bertZ() { return game.camZ + BERT_DZ; }

// The level clock. Ticks while he drives and while he is respawning -- a death costs its
// seconds -- and not during the ending, which is not on the clock. At zero a life goes
// through killBert() like every other death (invariant 12) and the clock starts again;
// the run ends when the lives do, the same way it ends everywhere else.
function tickClock(dt) {
  if (!level.clock || game.plunge) return;
  game.levelClock -= dt;
  if (game.levelClock > 0) return;
  game.levelClock = tune('clock', level.clock);
  if (game.state === STATE.PLAYING) {
    showHint(HINTS.clock);
    kartFalls();
  }
}

// The hop off the ramp, as a height in px: a parabola over AIR_TIME peaking in the middle.
function kartAirRise() {
  var t = 1 - bert.air / AIR_TIME;
  return AIR_RISE * 4 * t * (1 - t);
}

// Off the deck. There is nothing under the Mancunian Way but Manchester -- which is
// geographically true, and is why this screen kills the way it does.
function kartFalls() {
  if (game.invuln) {
    // An invulnerable run still has to be playable. Left hanging over the drop there is
    // nowhere for the screen to continue from, so he goes back on the centreline.
    bert.roadX = roadCentre(bertZ());
    bert.drift = 0;
    bert.spinOut = 0;
    return;
  }
  bert.falling = true;
  killBert();
}

// Returns true when the caller must stop: he has just died, and the frame is over.
function updateKartBert(dt) {
  // He never brakes and never stops. The throttle is the screen.
  var target = bert.boost > 0 ? BOOST_SPEED : KART_CRUISE;
  if (bert.speed < target) bert.speed = Math.min(target, bert.speed + KART_ACCEL * dt);
  else bert.speed = Math.max(target, bert.speed - KART_ACCEL * 1.6 * dt);

  if (bert.boost > 0) {
    bert.boost -= dt;
    // The cooldown starts when the boost ENDS, not when it starts, or it chains.
    if (bert.boost <= 0) { bert.boost = 0; bert.boostCool = BOOST_COOLDOWN; }
  } else if (bert.boostCool > 0) {
    bert.boostCool -= dt;
    if (bert.boostCool < 0) bert.boostCool = 0;
  }

  game.camZ += bert.speed * dt;

  // Steering. A spin-out takes the wheel away and leaves you carrying whatever drift you
  // had, which is exactly what makes oil lethal beside an edge and free in the middle.
  var steer = 0;
  if (bert.spinOut > 0) {
    bert.spinOut -= dt;
    bert.spin += dt * 14;
    if (bert.spinOut <= 0) { bert.spinOut = 0; bert.spin = 0; bert.drift = 0; }
  } else {
    if (keys.left) steer -= 1;
    if (keys.right) steer += 1;
    // In the air you keep just over half your steering: enough to save a bad launch, not
    // enough to ignore one.
    bert.drift = steer * STEER_SPEED * (bert.air > 0 ? AIR_STEER : 1);
  }
  bert.lean = steer;
  bert.roadX += bert.drift * dt;

  var z = bertZ();
  var beyondMain = bert.roadX > roadCentre(z) + ROAD_HALF;

  // A sinkhole. In the air you clear it, as you clear everything else under you.
  if (bert.air <= 0 && !bert.dying && holeUnder(bert.roadX, z)) {
    showHint(HINTS.sinkhole);
    kartFalls();
    return true;
  }
  // The extra life, if it is here and he is where it is -- which is over the drop, so in
  // practice mid-hop.
  if (!game.lifeTaken) {
    var ls = lifeSpot();
    if (ls && Math.abs(lapZ(z) - ls.z) < LIFE_Z && Math.abs(bert.roadX - ls.roadX) < LIFE_X) {
      game.lifeTaken = true;
      game.lives++;
      showHint(HINTS.life);
      sfx.pickup();
    }
  }

  if (bert.air > 0) {
    bert.air -= dt;
    if (bert.air <= 0) {
      bert.air = 0;
      // You land on whatever is under you when the hop runs out, and that is the whole
      // bargain the ramp offers.
      if (offDeck(bert.roadX, z)) { kartFalls(); return true; }
      sfx.stomp();
    }
  } else if (bert.onSlip && beyondMain && slipWidth(z) <= 0) {
    // The end of the unfinished slip road. A launch, not a fall -- the difference between
    // this and the deck edge is the whole reason the ramp is worth having.
    bert.air = AIR_TIME;
    showHint(HINTS.ramp);
    sfx.jump();
  } else if (offDeck(bert.roadX, z)) {
    kartFalls();
    return true;
  }
  bert.onSlip = slipWidth(z) > 0 && beyondMain;
  return false;
}

function updateKartMinis(dt) {
  var z = bertZ();
  for (var i = 0; i < game.frauds.length; i++) {
    var f = game.frauds[i];
    if (f.type !== 'mini') continue;
    if (f.dying) { f.deathTimer += dt; f.spin += dt * 9; continue; }

    // Evasion. It sees him coming: close behind and lined up, it swerves to the far side
    // of the carriageway, slower than he can steer, then holds that line for DODGE_COOL --
    // which is the window it gets caught in. Twice per approach and no more, or it could
    // never be caught at all. Closer still and it floors it, for under a second and to
    // under his cruise, so the boost is what answers it.
    var ahead = f.z - z;
    var dx = f.roadX - bert.roadX;
    if (ahead > DODGE_RESET) f.dodges = 0;
    if (f.dodgeCool > 0) f.dodgeCool -= dt;
    if (f.burstCool > 0) f.burstCool -= dt;
    if (f.burst > 0) f.burst -= dt;
    if (!bert.dying && ahead > 0 && ahead < DODGE_Z && Math.abs(dx) < DODGE_X &&
        f.dodgeCool <= 0 && f.dodges < DODGE_MAX) {
      // Away from him; dead astern, away from the side it is already on.
      var dir = Math.abs(dx) > 20 ? (dx > 0 ? 1 : -1) : (f.lane > 0 ? -1 : 1);
      f.dodgeTo = dir * (ROAD_HALF - 150);
      f.dodges++;
      f.dodgeCool = DODGE_COOL;
    }
    if (f.dodgeTo !== null) {
      var stepX = DODGE_SPEED * dt;
      if (Math.abs(f.dodgeTo - f.lane) <= stepX) { f.lane = f.dodgeTo; f.dodgeTo = null; }
      else f.lane += (f.dodgeTo > f.lane ? 1 : -1) * stepX;
    }
    if (!bert.dying && ahead > 0 && ahead < BURST_Z && f.burstCool <= 0 && f.burst <= 0) {
      f.burst = BURST_TIME;
      f.burstCool = BURST_COOL;
    }
    f.z += (f.burst > 0 ? Math.max(f.speed, BURST_SPEED) : f.speed) * dt;
    // Each one weaves at its own rate and width. Five karts holding the exact centreline
    // read as a train; five weaving out of phase read as five drivers.
    f.weaveT += dt;
    var c = roadCentre(f.z);
    f.roadX = c + f.lane + Math.sin(f.weaveT * f.weaveRate) * f.weaveAmp;
    // Held on the carriageway rather than merely on the road: a Mini that wandered onto
    // the slip road would drive off the end of it, and the screen would lose a target it
    // cannot finish without.
    if (f.roadX < c - ROAD_HALF + 40) f.roadX = c - ROAD_HALF + 40;
    if (f.roadX > c + ROAD_HALF - 40) f.roadX = c + ROAD_HALF - 40;

    // Squished -- driven over, from any angle. There is no stomp on this screen, only the
    // front of a kart, and the box is derived in the constants above.
    if (!bert.dying && bert.air <= 0 &&
        Math.abs(f.z - z) < SQUISH_Z && Math.abs(f.roadX - bert.roadX) < SQUISH_X) {
      f.dying = true;
      f.deathTimer = 0;
      f.spin = 0;
      game.minisLeft--;
      sfx.stomp();
      if (game.minisLeft <= 0 && !game.giantSpawned) spawnGiant(false);
      continue;
    }

    // A Mini that has slipped behind the camera can never be caught again, and the Giant
    // does not appear until all five are gone. Left alone that is a screen made unwinnable
    // by overtaking -- silent, terminal, and reached by driving well, which is exactly the
    // failure the Concourse shipped and was reviewed for. It goes back up the road instead.
    if (f.z < game.camZ - 60) {
      f.z = z + 600 + (i * 137) % 400;
      f.lane = ((i % 3) - 1) * (ROAD_HALF - 150);
    }
  }
}

function updateKartGiant(dt) {
  var g = game.giant;
  var z = bertZ();
  if (g.invulnTimer > 0) g.invulnTimer -= dt;

  g.z += GIANT_KART_SPEED * dt;
  // He cannot be passed. He is faster than a Mini and slower than Bert, so without this a
  // single spin-out at the wrong moment puts him behind the camera -- and from there he
  // recedes for ever, because Bert is the quicker of the two. The screen would look fine
  // and be unfinishable, which is the exact shape of the bug the Concourse shipped.
  //
  // GIANT_MIN_LEAD sits inside ram range on purpose: drawing level with him is a hit, not
  // a stalemate. What stops that chaining is RAM_KNOCK, which is further than Bert can
  // close inside KART_INVULN at cruise.
  if (g.z < bertZ() + GIANT_MIN_LEAD) g.z = bertZ() + GIANT_MIN_LEAD;
  g.weaveT += dt;
  // He drives across your line rather than away from it. He is not trying to escape -- he
  // is trying to make you miss -- so the weave stays well inside the carriageway and he is
  // always reachable without leaving it.
  g.roadX = roadCentre(g.z) + Math.sin(g.weaveT * GIANT_WEAVE_RATE) * (ROAD_HALF * GIANT_WEAVE_AMP);

  var stage = Math.min(g.hitsTaken, OIL_INTERVAL.length - 1);

  // Oil, dropped in the line you are actually in. Not lethal by itself: it takes the wheel
  // away for a second, and what that costs depends entirely on where the edge is.
  g.oilTimer -= dt;
  if (g.oilTimer <= 0) {
    g.oilTimer = OIL_INTERVAL[stage];
    game.oil.push({ roadX: bert.roadX, z: g.z - 40, life: OIL_LIFE });
  }
  // ...and footballs back over his shoulder, which are lethal, because something he does
  // has to be.
  g.throwTimer -= dt;
  if (g.throwTimer <= 0) {
    g.throwTimer = LOB_INTERVAL[stage];
    game.balls.push({ lane: g.roadX - roadCentre(g.z), roadX: g.roadX, z: g.z - 30,
                      from: 'boss', life: 0 });
    sfx.throwBall();
  }

  // The ram. Contact is Bert's verb here, so the overlap hurts HIM -- boss.contactDamage
  // is false for that reason and not the prologue's.
  if (!bert.dying && bert.air <= 0 && g.invulnTimer <= 0 &&
      Math.abs(g.z - z) < SQUISH_Z + 20 && Math.abs(g.roadX - bert.roadX) < SQUISH_X + 20) {
    return kartHitsGiant(g);
  }
  return false;
}

// One depletion, from a ram or from a football. The knock is what stops ramming being
// free: every hit shoves him most of a second's driving up the road and you have to close
// the gap again.
//
// Returns true when that was the last one. The caller MUST stop on it: meeting the gate
// runs startPlunge(), which empties game.balls, game.oil and game.boxes -- and the football
// path calls this from inside a loop over game.balls. A hit landed from the second ball in
// flight then walked off the end of an array that had just been emptied underneath it,
// which is a crash on a legitimate way of winning the screen.
function kartHitsGiant(g) {
  g.hitsTaken++;
  g.invulnTimer = KART_INVULN;
  g.z += RAM_KNOCK;
  sfx.giantHit();
  if (g.hitsTaken >= level.boss.hits) { gateBoss(g); return true; }
  return false;
}

// Item boxes, topped up ahead of him rather than laid out once -- the road has no end, so
// neither can the supply. Placement is deterministic for the same reason the Crossing's
// traffic is: a random layout can produce a stretch with nothing in it, and no amount of
// testing catches the run where it does.
function updateBoxes(dt) {
  if (!game.giantSpawned) return;
  var z = bertZ();
  while (game.boxNext < z + DRAW_DIST) {
    game.boxes.push({
      roadX: roadCentre(game.boxNext) + ((game.boxIndex % 3) - 1) * 210,
      z: game.boxNext
    });
    game.boxIndex++;
    game.boxNext += BOX_EVERY;
  }
  for (var i = game.boxes.length - 1; i >= 0; i--) {
    var bx = game.boxes[i];
    if (bx.z < game.camZ - 100) { game.boxes.splice(i, 1); continue; }
    if (bert.dying || bert.football > 0) continue;
    if (Math.abs(bx.z - z) < BOX_Z && Math.abs(bx.roadX - bert.roadX) < BOX_X) {
      bert.football = 1;
      game.boxes.splice(i, 1);
      showHint(HINTS.football);
      sfx.pickup();
    }
  }
}

function updateOil(dt) {
  var z = bertZ();
  for (var i = game.oil.length - 1; i >= 0; i--) {
    var o = game.oil[i];
    o.life -= dt;
    if (o.life <= 0 || o.z < game.camZ - 100) { game.oil.splice(i, 1); continue; }
    if (bert.dying || bert.air > 0 || bert.spinOut > 0 || bert.invincible > 0) continue;
    if (Math.abs(o.z - z) < OIL_Z && Math.abs(o.roadX - bert.roadX) < OIL_X) {
      bert.spinOut = SPIN_TIME;
      // The shove continues the way you were already going. Dead straight, it takes you
      // wide on the bend -- which is where the road was about to put you anyway.
      var dir = bert.drift !== 0 ? (bert.drift > 0 ? 1 : -1)
              : (roadCentre(z + 240) > roadCentre(z) ? 1 : -1);
      bert.drift = dir * OIL_SHOVE;
      game.oil.splice(i, 1);
      sfx.skid();
    }
  }
  return false;
}

// One list for every football in the air, his and Bert's, so that killBert() and
// fraudFlees() clearing it still means what they mean everywhere else in the game.
function updateKartBalls(dt) {
  var z = bertZ();
  for (var i = game.balls.length - 1; i >= 0; i--) {
    var b = game.balls[i];
    b.life += dt;
    if (b.from === 'boss') {
      b.z -= KART_BALL_SPEED * dt;
      // It holds its LANE, not its heading. A ball flying in a straight line leaves the
      // road on the first bend, and then a screen whose whole subject is the road has
      // ordnance in it that ignores the road.
      b.roadX = roadCentre(b.z) + b.lane;
      if (b.z < game.camZ - 60 || b.life > 8) { game.balls.splice(i, 1); continue; }
      if (bert.dying || bert.air > 0 || bert.invincible > 0) continue;
      if (Math.abs(b.z - z) < KART_BALL_Z && Math.abs(b.roadX - bert.roadX) < KART_BALL_X) {
        game.balls.splice(i, 1);
        killBert();
        return true;
      }
    } else {
      b.z += SHOT_SPEED * dt;
      b.roadX = roadCentre(b.z) + b.lane;
      if (b.life > SHOT_LIFE) { game.balls.splice(i, 1); continue; }
      var g = game.giant;
      if (!g || g.dying || g.escaping || g.invulnTimer > 0) continue;
      if (Math.abs(b.z - g.z) < SHOT_Z && Math.abs(b.roadX - g.roadX) < SHOT_X) {
        game.balls.splice(i, 1);
        if (kartHitsGiant(g)) return true;
      }
    }
  }
  return false;
}

// Bert's screen position, which is a projection of where he is on the road and nothing
// else. Kept true every frame because the shard test, the HUD and the plunge all read it.
function projectCast() {
  var p = project(bert.roadX, bertZ());
  var b = bodyRect(bert.def, 0, 0);
  bert.x = p.x - b.w / 2;
  bert.y = p.y - b.h - (bert.air > 0 ? kartAirRise() : 0);
}

// --- The plunge. The scripted ending: he swerves off the deck, Bert follows him over, and
// --- both go into the Rochdale Canal. The level's lethal hazard is the level's exit, which
// --- is the whole reason the fall was worth building.
// ---
// --- Both arcs are evaluated in closed form rather than integrated, so the piece can be
// --- parked exactly on the path Bert is going to take rather than near it. A cut scene
// --- that depends on a collision landing is a cut scene that eventually does not.

function startPlunge(g) {
  game.balls.length = 0;
  game.oil.length = 0;
  game.boxes.length = 0;
  bert.football = 0;
  bert.spinOut = 0;
  bert.air = 0;
  bert.invincible = Math.max(bert.invincible, PLUNGE_TIME + 1.5);
  var gp = project(g.roadX, g.z);
  var bb = bodyRect(bert.def, 0, 0);
  game.plunge = {
    t: 0,
    // Where each of them was when it started, so the swerve continues off the road rather
    // than snapping to a scripted position.
    gx: gp.x, gy: gp.y - 40 * gp.scale, gs: gp.scale,
    gvx: 250, gvy: -150,
    bx: bert.x + bb.w / 2, by: bert.y + bb.h / 2,
    bvx: 300, bvy: -190,
    over: false
  };
  sfx.giantHit();
}

// Where Bert is, ft seconds after he leaves the deck. The one function the shard placement
// and the drawing both go through, which is what makes the pickup exact.
function plungeBertAt(ft) {
  var pl = game.plunge;
  return {
    x: pl.bx + pl.bvx * ft,
    y: pl.by + pl.bvy * ft + 0.5 * PLUNGE_G * ft * ft
  };
}

function updatePlunge(dt) {
  var pl = game.plunge;
  pl.t += dt;
  // The road keeps rolling for the first beat -- he is still driving when the Fraud goes.
  if (!pl.over) game.camZ += bert.speed * dt * Math.max(0, 1 - pl.t / PLUNGE_LEAD);

  if (!pl.over && pl.t >= PLUNGE_LEAD) {
    pl.over = true;
    // He goes over, and the piece is dropped on the exact point his fall reaches at
    // PLUNGE_MEET. fraudFlees() is still the only thing that ends a screen in the Fraud
    // leaving -- it is called here rather than at the gate because here is where the drop
    // has somewhere to land.
    var meet = plungeBertAt(PLUNGE_MEET);
    fraudFlees(game.giant, meet);
    sfx.hurt();
  }

  // The backstop. The arcs are closed form and the harness plays the ending through and
  // asserts he collects it, so this should be unreachable -- but an ending that can fail
  // to end is a screen that hangs, and that is not a thing to leave to arithmetic.
  if (pl.t > PLUNGE_TIME + 1.2 && game.shard && !game.shard.taken) game.shard.taken = true;
}

// Both of them, mid-air, in screen coordinates. Bert's body is what the shard test reads,
// so it is written back the same way projectCast() writes it during the drive.
function projectPlunge() {
  var pl = game.plunge;
  var bb = bodyRect(bert.def, 0, 0);
  if (pl.over) {
    var p = plungeBertAt(pl.t - PLUNGE_LEAD);
    bert.x = p.x - bb.w / 2;
    bert.y = p.y - bb.h / 2;
  }
  pl.gxNow = pl.gx + pl.gvx * pl.t;
  pl.gyNow = pl.gy + pl.gvy * pl.t + 0.5 * PLUNGE_G * pl.t * pl.t;
}

function updatePlaying(dt) {
  if (level.engine === 'maze') { updateConcourse(dt); return; }
  // Engines are separate update paths, not flags inside one: a top-down screen shares the
  // shell and none of the physics, and mixing them is how both end up fragile.
  if (level.engine === 'topdown') { updateCrossing(dt); return; }
  if (level.engine === 'mode7') { updateMancunian(dt); return; }
  // The run clock only ticks here, so intro and complete cards, the respawn hold and the
  // portrait pause (which stops update() entirely) are all excluded without extra logic.
  game.runTime += dt;

  // Bert input
  var move = 0;
  if (keys.left) move -= 1;
  if (keys.right) move += 1;
  bert.vx = move * BERT_SPEED;
  if (move !== 0) bert.facing = move;
  // Climbing suspends gravity outright, so it replaces the physics step rather than
  // modifying it.
  if (!updateClimb(bert, dt)) integrate(bert, dt);
  if (bert.grounded && !bert.dying) { bert.safeX = bert.x; bert.safeY = bert.y; }
  if (bert.invincible > 0) bert.invincible -= dt;
  if (bert.hammer > 0) {
    bert.hammer -= dt;
    // It burned out in his hands rather than being lost -- nothing to put back.
    if (bert.hammer <= 0) { bert.hammer = 0; bert.carriedFrom = null; }
  }
  if (bert.swing > 0) bert.swing -= dt;
  if (game.hintTimer > 0) game.hintTimer -= dt;

  // Frauds
  for (var i = 0; i < game.frauds.length; i++) {
    var f = game.frauds[i];
    if (f.escaping) { integrateEscape(f, dt); continue; }
    if (f.dying) { integrateDying(f, dt); continue; }
    if (f.type === 'mini') updateMini(f, dt);
    else updateGiant(f, dt);
    integrate(f, dt);
  }

  if (game.bannerTimer > 0) game.bannerTimer -= dt;
  updateBalls(dt);
  updateRollers(dt);
  updatePickups(dt);
  updateTrophyBits(dt);

  // Checked before contact, so arriving at a goal a boss is standing near can never be
  // overruled by walking into him on the same frame.
  if (resolveEnding(dt)) return;

  // The swing. Its box reaches past the body, so it is resolved on its own rather than
  // out of the contact loop -- the whole point is to kill what you have not touched.
  var sb = swingBox(bert);
  if (sb && !bert.dying) {
    for (var sw = 0; sw < game.frauds.length; sw++) {
      var sf = game.frauds[sw];
      if (sf.dying || sf.escaping || !overlaps(sb, bodyOf(sf))) continue;
      if (sf.type === 'mini') smashMini(sf);
      else if (bert.swingBig && level.boss.routedBy === 'bighammer') {
        bert.bigHammer = 0;
        bert.carriedFrom = null;
        sfx.giantHit();
        fraudFlees(sf);
      }
    }
    for (var sr = game.rollers.length - 1; sr >= 0; sr--) {
      var srl = game.rollers[sr];
      if (circleHitsRect(srl.x, srl.y, ROLLER_R, sb)) { game.rollers.splice(sr, 1); sfx.stomp(); }
    }
  }

  // Contact. Invulnerability suppresses damage only -- stomping still works, otherwise
  // landing on a Fraud during respawn grace would silently do nothing.
  if (!bert.dying) {
    for (var j = 0; j < game.frauds.length; j++) {
      var fr = game.frauds[j];
      if (fr.dying || fr.escaping) continue;
      var r = contact(bert, fr, dt);
      if (r === 'stomp') {
        bert.vy = STOMP_BOUNCE_V;
        if (fr.type === 'giant' && (level.boss.hits === 0 || fr.trophyTimer > 0)) {
          // A boss who cannot be fought is a harmless bounce, not a free hit -- and nor is
          // one already mid-shatter, or a fourth stomp would re-run the beat.
        } else if (fr.type === 'mini') {
          fr.dying = true;
          fr.vx = (fr.x < bert.x ? -1 : 1) * 190;
          fr.vy = -330;
          game.minisLeft--;
          sfx.stomp();
          if (game.minisLeft <= 0 && !game.giantSpawned) spawnGiant();
        } else if (level.boss.hits > 0 && fr.invulnTimer <= 0) {
          fr.hitsTaken++;
          fr.invulnTimer = GIANT_INVULN;
          fr.knockDir = (fr.x < bert.x) ? -1 : 1;
          sfx.giantHit();
          if (fr.hitsTaken >= level.boss.hits) gateBoss(fr);
        }
        // else: landing on the Giant while it flashes is a harmless bounce
      } else if (r === 'damage') {
        // Carrying a hammer saves nobody -- only swinging it does, and that is resolved
        // above. Walking into a Mini with one on your shoulder is exactly as fatal as
        // walking into one with empty hands.
        if (fr.type === 'giant' && level.boss.contactDamage === false) {
          // Deliberately nothing: a boss who cannot be fought cannot kill you either.
        } else if (bert.invincible <= 0) {
          killBert();
          break;
        }
      }
    }
  }

  if (!bert.dying && bert.invincible <= 0) {
    for (var q = 0; q < game.balls.length; q++) {
      if (ballHitsBert(game.balls[q])) {
        game.balls.splice(q, 1);
        killBert();
        break;
      }
    }
  }

  if (!bert.dying) {
    for (var rr = game.rollers.length - 1; rr >= 0; rr--) {
      var rl = game.rollers[rr];
      if (!circleHitsBody(rl.x, rl.y, ROLLER_R, bert)) continue;
      // Smashing one is the swing's job, above. Reaching the body means it got past him.
      if (bert.invincible <= 0) { killBert(); break; }
    }
  }

  // Retire finished death animations
  for (var k = game.frauds.length - 1; k >= 0; k--) {
    if (game.frauds[k].dying && game.frauds[k].deathTimer > DEATH_ANIM) game.frauds.splice(k, 1);
  }

}

function updateRespawning(dt) {
  if (level.engine === 'mode7') {
    // Off the deck, and there is nothing under it to land on: he keeps going forward and
    // drops out of frame while the road rolls on without him.
    bert.vy += PLUNGE_G * dt;
    bert.y += bert.vy * dt;
    bert.x += bert.drift * dt * 0.5;
    bert.spin += dt * 7;
    game.camZ += bert.speed * dt * 0.5;
    tickClock(dt);
  } else if (level.engine === 'topdown' || level.engine === 'maze') {
    // No gravity to flop under: the death is a spin and a fade where he stood.
    bert.deathTimer += dt;
    bert.spin += dt * 9;
    updateTraffic(dt);
  } else {
    integrateDying(bert, dt);
    for (var i = 0; i < game.frauds.length; i++) {
      var f = game.frauds[i];
      if (f.escaping) { integrateEscape(f, dt); continue; }
      if (f.dying) { integrateDying(f, dt); continue; }
      if (f.type === 'mini') updateMini(f, dt);
      else updateGiant(f, dt);
      integrate(f, dt);
    }
    updateBalls(dt);
    updateRollers(dt);
  }
  if (game.bannerTimer > 0) game.bannerTimer -= dt;
  updateTrophyBits(dt);

  game.respawnTimer -= dt;
  if (game.respawnTimer <= 0) {
    if (game.lives <= 0) {
      game.state = STATE.GAME_OVER;
      restartBtn.style.display = 'block';
      sfx.gameOver();
    } else {
      // Enemy progress is deliberately untouched: defeated Frauds stay defeated.
      //
      // Where he comes back is a per-screen decision. The prologue is one room and a walk
      // back from the spawn costs seconds; a four-girder climb is a different proposition,
      // and sending him to the bottom of it turns one mistake into replaying the screen.
      // He returns to the last surface he was stood on, not the point of death, which may
      // well have been mid-air.
      var fresh = makePlayer();
      if (tune('respawnAtDeath', false)) { bert.x = bert.safeX; bert.y = bert.safeY; }
      else { bert.x = fresh.x; bert.y = fresh.y; bert.safeX = fresh.x; bert.safeY = fresh.y; }
      bert.vx = 0; bert.vy = 0;
      bert.dying = false; bert.spin = 0;
      bert.facing = 1;
      bert.climbing = null;
      bert.row = fresh.row; bert.hopT = 0;
      bert.dir = null; bert.want = null; bert.powered = 0;
      // Back on the centreline, at the distance he had reached: the road is the level and
      // sending him back down it would be replaying the screen for one mistake.
      if (level.engine === 'mode7') {
        bert.roadX = roadCentre(bertZ());
        bert.speed = KART_CRUISE * 0.5;
        bert.drift = 0; bert.spinOut = 0; bert.air = 0; bert.onSlip = false;
        bert.boost = 0; bert.boostCool = 0; bert.football = 0; bert.falling = false;
        bert.vy = 0;
        projectCast();
      }
      game.crossTimer = tune('crossTime', CROSS_TIME);
      bert.hammer = 0; bert.bigHammer = 0; bert.swing = 0; bert.carriedFrom = null;
      bert.invincible = POST_RESPAWN_INVULN;
      game.state = STATE.PLAYING;
    }
  }
}

function updateLevelIntro(dt) {
  game.introTimer -= dt;
  if (game.introTimer <= 0) game.state = STATE.PLAYING;
}

function updateLevelComplete(dt) {
  game.completeTimer -= dt;
  if (game.completeTimer <= 0) startLevel(game.levelIndex + 1);
}

function updateShardCard(dt) {
  game.shardTimer -= dt;
  if (game.shardTimer <= 0) finishLevel();
}

function update(dt) {
  if (game.state === STATE.PLAYING) updatePlaying(dt);
  else if (game.state === STATE.RESPAWNING) updateRespawning(dt);
  else if (game.state === STATE.LEVEL_INTRO) updateLevelIntro(dt);
  else if (game.state === STATE.LEVEL_COMPLETE) updateLevelComplete(dt);
  else if (game.state === STATE.SHARD) updateShardCard(dt);
}

// --- Background, built once to an offscreen canvas and blitted each frame.

var BANNERS = [
  { x: 300, y: 58, width: 150, height: 34, text: 'BERT YONG' },
  { x: 545, y: 58, width: 150, height: 34, text: 'BERT YONG' },
  { x: 790, y: 58, width: 150, height: 34, text: 'BERT YONG' }
];

var bgCanvas = document.createElement('canvas');
bgCanvas.width = CANVAS_WIDTH;
bgCanvas.height = CANVAS_HEIGHT;
var bgBuilt = false;

var stadiumImg = new Image();
var stadiumReady = false;
var stadiumTriedPng = false;
var stadiumSettled = false;
stadiumImg.onload = function () { stadiumReady = true; stadiumSettled = true; bgBuilt = false; };
stadiumImg.onerror = function () {
  if (!stadiumTriedPng) { stadiumTriedPng = true; stadiumImg.src = 'stadium.png'; return; }
  stadiumReady = false;
  stadiumSettled = true;
  bgBuilt = false;
};
stadiumImg.src = 'stadium.jpg';

// Measured from the source: sky runs to row ~340 of 679, roof ~340-400, stands
// ~400-563, pitch below. Half the frame is sky, so the crop is pushed all the way down
// and zoomed until the seating bowl fills the play area.
var BG_ZOOM = 1.6;
var BG_FOCUS_Y = 1.0;

function drawCover(g, img, w, h) {
  var cr = w / h;
  var sw = img.naturalWidth;
  var sh = sw / cr;
  if (sh > img.naturalHeight) { sh = img.naturalHeight; sw = sh * cr; }
  sw /= BG_ZOOM;
  sh /= BG_ZOOM;
  var sx = (img.naturalWidth - sw) / 2;
  var sy = (img.naturalHeight - sh) * BG_FOCUS_Y;
  g.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
}

// The photo is of an empty stadium and the brief calls for cheering fans, but pixel
// dots over photographic seats read as TV static -- the rows don't align and the band
// has hard edges. Off by default; flip to true to compare.
var SHOW_PIXEL_CROWD = false;
var CROWD_TOP = 232;
var CROWD_BOTTOM = 410;

function drawPhotoCrowd(g) {
  if (!SHOW_PIXEL_CROWD) return;
  var colors = ['#8fc4e8', '#ffffff', '#2e5f96', '#bfe0f5', '#16325c'];
  g.globalAlpha = 0.82;
  for (var row = 0; CROWD_TOP + row * 12 < CROWD_BOTTOM; row++) {
    var y = CROWD_TOP + row * 12;
    for (var x = 2; x < CANVAS_WIDTH; x += 7) {
      g.fillStyle = colors[(x * 3 + row * 7) % colors.length];
      g.fillRect(x + (row % 2 ? 3 : 0), y + Math.sin(x * 0.6 + row * 2.1) * 1.5, 4, 4);
    }
  }
  g.globalAlpha = 1;
}

function drawBanners(g) {
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.font = 'bold 17px "Courier New", monospace';
  for (var i = 0; i < BANNERS.length; i++) {
    var b = BANNERS[i];
    g.fillStyle = '#ffffff';
    g.fillRect(b.x, b.y, b.width, b.height);
    g.strokeStyle = '#12294f';
    g.lineWidth = 3;
    g.strokeRect(b.x, b.y, b.width, b.height);
    g.fillStyle = '#12294f';
    g.fillText(b.text, b.x + b.width / 2, b.y + b.height / 2 + 1);
  }
}

// Over the photo a flat green bar clashes with photographic turf, so the standing
// surface is a shaded band plus a crisp line instead.
function drawGroundStrip(g, overPhoto) {
  if (overPhoto) {
    g.fillStyle = 'rgba(3,18,9,0.38)';
    g.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);
    g.fillStyle = 'rgba(255,255,255,0.9)';
    g.fillRect(0, GROUND_Y, CANVAS_WIDTH, 3);
    return;
  }
  g.fillStyle = '#2e8b3d';
  g.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);
  g.fillStyle = '#37a047';
  for (var sx = 0; sx < CANVAS_WIDTH; sx += 120) {
    g.fillRect(sx, GROUND_Y, 60, CANVAS_HEIGHT - GROUND_Y);
  }
  g.fillStyle = 'rgba(255,255,255,0.7)';
  g.fillRect(0, GROUND_Y, CANVAS_WIDTH, 3);
}

function buildBackground() {
  var g = bgCanvas.getContext('2d');
  bgBuilt = true;
  // fitStage() sizes bgCanvas in device pixels. Everything below is written in 960x640
  // logical units, so scale once here rather than touching sixty draw calls. This is one
  // of only two places allowed to call setTransform -- see the invariants in CLAUDE.md.
  g.setTransform(bgCanvas.width / CANVAS_WIDTH, 0, 0, bgCanvas.height / CANVAS_HEIGHT, 0, 0);
  level.background(g);
}

// --- Level backgrounds. Each takes a context already scaled to logical units and must
// --- not touch the transform.

// The Etihad: the photo if it loaded, a drawn stand-in if it did not. Both paths ship.
function drawEtihad(g) {
  if (stadiumReady) {
    // Saturation is pushed UP, not down: the photo is an overcast, near-grey shot and
    // this is meant to be a Manchester-is-Blue celebration. Brightness carries the
    // contrast so Bert's sky-blue kit still reads against the seats.
    g.filter = 'saturate(1.45) brightness(0.66) contrast(1.05)';
    drawCover(g, stadiumImg, CANVAS_WIDTH, CANVAS_HEIGHT);
    g.filter = 'none';
    var scrim = g.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
    scrim.addColorStop(0, 'rgba(10,26,58,0.50)');
    scrim.addColorStop(0.55, 'rgba(8,20,46,0.38)');
    scrim.addColorStop(1, 'rgba(6,14,30,0.30)');
    g.fillStyle = scrim;
    g.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // Sink the leftover strip of overcast sky into darkness so the top of the screen
    // reads as roof shadow rather than dead space behind the upper platforms.
    var top = g.createLinearGradient(0, 0, 0, 210);
    top.addColorStop(0, 'rgba(4,9,20,0.92)');
    top.addColorStop(1, 'rgba(4,9,20,0)');
    g.fillStyle = top;
    g.fillRect(0, 0, CANVAS_WIDTH, 210);

    drawPhotoCrowd(g);
    drawBanners(g);
    drawGroundStrip(g, true);
    return;
  }

  // Drawn fallback. Deliberately dark so Bert's sky-blue kit reads against it.
  var bowl = g.createLinearGradient(0, 158, 0, GROUND_Y);
  bowl.addColorStop(0, '#1a3560');
  bowl.addColorStop(1, '#0d1f3d');
  g.fillStyle = bowl;
  g.fillRect(0, 0, CANVAS_WIDTH, GROUND_Y);

  g.fillStyle = '#060b14';
  g.fillRect(0, 0, CANVAS_WIDTH, 26);
  for (var f = 0; f < 4; f++) {
    var fx = 120 + f * 240;
    var glow = g.createRadialGradient(fx, 26, 2, fx, 26, 60);
    glow.addColorStop(0, 'rgba(255,255,235,0.55)');
    glow.addColorStop(1, 'rgba(255,255,235,0)');
    g.fillStyle = glow;
    g.fillRect(fx - 60, 0, 120, 90);
    g.fillStyle = '#f4f4dc';
    g.fillRect(fx - 16, 16, 32, 8);
  }

  g.fillStyle = '#0e1c33';
  g.fillRect(0, 26, CANVAS_WIDTH, 124);
  var colors = ['#6cabdd', '#ffffff', '#2e5f96', '#a8d4ef', '#1b3a63'];
  for (var row = 0; row < 9; row++) {
    var y = 30 + row * 14;
    for (var x = 3; x < CANVAS_WIDTH; x += 8) {
      g.fillStyle = colors[(x * 3 + row * 7) % colors.length];
      g.fillRect(x + (row % 2 ? 4 : 0), y + Math.sin(x * 0.6 + row * 2.1) * 2, 5, 5);
    }
  }

  g.fillStyle = '#060b14';
  g.fillRect(0, 100, CANVAS_WIDTH, 6);
  g.fillRect(0, 150, CANVAS_WIDTH, 8);
  g.fillStyle = 'rgba(108,171,221,0.35)';
  g.fillRect(0, 158, CANVAS_WIDTH, 2);

  drawBanners(g);

  for (var hx = 0; hx < CANVAS_WIDTH; hx += 80) {
    g.fillStyle = (hx / 80) % 2 ? '#12294f' : '#1c4c85';
    g.fillRect(hx, 574, 80, 26);
  }
  g.fillStyle = 'rgba(108,171,221,0.5)';
  g.fillRect(0, 572, CANVAS_WIDTH, 2);

  drawGroundStrip(g, false);
}

// The North Stand mid-rebuild, at night. Deep blue rather than black throughout: a black
// backdrop swallows an airborne character, which is the same reason no kit in the game is
// black (FOUNDATIONS.md section 4).
function drawScaffold(g) {
  var sky = g.createLinearGradient(0, 0, 0, GROUND_Y);
  sky.addColorStop(0, '#060c1a');
  sky.addColorStop(0.55, '#0e1e36');
  sky.addColorStop(1, '#152b49');
  g.fillStyle = sky;
  g.fillRect(0, 0, CANVAS_WIDTH, GROUND_Y);

  // Floodlights on the far side, so the scaffold reads as silhouette against the glow.
  // Kept clear of x < 300: the HUD panel is only 78% opaque and a lamp behind it shows
  // through as a stray grey block.
  for (var f = 0; f < 3; f++) {
    var fx = 340 + f * 250;
    var glow = g.createRadialGradient(fx, 56, 4, fx, 56, 220);
    glow.addColorStop(0, 'rgba(200,225,255,0.24)');
    glow.addColorStop(1, 'rgba(200,225,255,0)');
    g.fillStyle = glow;
    g.fillRect(fx - 220, 0, 440, 320);
    g.fillStyle = '#dfe8f5';
    g.fillRect(fx - 22, 38, 44, 9);
  }

  // The half-built bowl behind. Very low contrast on purpose -- it is depth, not detail,
  // and anything busier competes with the girders for the eye.
  g.fillStyle = 'rgba(8,18,34,0.5)';
  for (var t = 0; t < 6; t++) g.fillRect(0, 268 + t * 38, CANVAS_WIDTH, 16);

  // Scaffold lattice. Faint on purpose -- the girders you can stand on must read as the
  // only solid thing on the screen.
  g.strokeStyle = 'rgba(150,182,218,0.13)';
  g.lineWidth = 3;
  g.beginPath();
  for (var vx = 40; vx < CANVAS_WIDTH; vx += 80) { g.moveTo(vx, 110); g.lineTo(vx, GROUND_Y); }
  for (var dx = 0; dx < CANVAS_WIDTH; dx += 160) {
    g.moveTo(dx, GROUND_Y); g.lineTo(dx + 160, 110);
    g.moveTo(dx + 160, GROUND_Y); g.lineTo(dx, 110);
  }
  g.stroke();

  // Site floor: hardcore and a kerb, not turf.
  g.fillStyle = '#2b2a26';
  g.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);
  g.fillStyle = '#39372f';
  for (var sx = 0; sx < CANVAS_WIDTH; sx += 90) g.fillRect(sx, GROUND_Y + 8, 46, 12);
  g.fillStyle = '#e8b53a';
  g.fillRect(0, GROUND_Y, CANVAS_WIDTH, 4);
}

// THE CROSSING, seen from above. Built from the same `rows` the engine reads, so the
// picture and the hazards can never drift apart -- a lane that looks like water is water.
function drawCrossing(g) {
  var rows = (level.map && level.map.rows) || [];
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (r.kind === 'water') {
      var wg = g.createLinearGradient(0, r.y, 0, r.y + r.h);
      wg.addColorStop(0, '#14384a');
      wg.addColorStop(1, '#0d2836');
      g.fillStyle = wg;
      g.fillRect(0, r.y, CANVAS_WIDTH, r.h);
      // Ripples, offset per lane so the canal does not read as one flat band.
      g.strokeStyle = 'rgba(150,200,225,0.12)';
      g.lineWidth = 2;
      g.beginPath();
      for (var rx = (i * 37) % 90; rx < CANVAS_WIDTH; rx += 90) {
        g.moveTo(rx, r.y + r.h * 0.34);
        g.lineTo(rx + 34, r.y + r.h * 0.34);
        g.moveTo(rx + 45, r.y + r.h * 0.7);
        g.lineTo(rx + 79, r.y + r.h * 0.7);
      }
      g.stroke();
    } else if (r.kind === 'road') {
      g.fillStyle = (i % 2) ? '#2f3338' : '#33373d';
      g.fillRect(0, r.y, CANVAS_WIDTH, r.h);
      // Dashes on the boundary between two road lanes only -- a dashed line against the
      // kerb would say you can cross there.
      if (rows[i + 1] && rows[i + 1].kind === 'road') {
        g.fillStyle = 'rgba(233,233,220,0.55)';
        for (var dx = 20; dx < CANVAS_WIDTH; dx += 84) g.fillRect(dx, r.y + r.h - 3, 46, 3);
      }
    } else if (r.kind === 'median') {
      g.fillStyle = '#5b6067';
      g.fillRect(0, r.y, CANVAS_WIDTH, r.h);
      g.fillStyle = '#c9cdd2';
      g.fillRect(0, r.y, CANVAS_WIDTH, 4);
      g.fillRect(0, r.y + r.h - 4, CANVAS_WIDTH, 4);
      g.strokeStyle = 'rgba(232,181,58,0.55)';
      g.lineWidth = 3;
      g.beginPath();
      for (var hx = -20; hx < CANVAS_WIDTH; hx += 26) {
        g.moveTo(hx, r.y + r.h - 8);
        g.lineTo(hx + 18, r.y + 8);
      }
      g.stroke();
    } else {
      // Bank: grass and a kerb, with the kerb on the water side.
      g.fillStyle = '#33502f';
      g.fillRect(0, r.y, CANVAS_WIDTH, r.h);
      g.fillStyle = 'rgba(255,255,255,0.05)';
      for (var gx = 0; gx < CANVAS_WIDTH; gx += 64) g.fillRect(gx, r.y + 8, 30, 5);
      g.fillStyle = '#8d9298';
      if (i === 0) g.fillRect(0, r.y + r.h - 8, CANVAS_WIDTH, 8);
      else g.fillRect(0, r.y, CANVAS_WIDTH, 8);
    }
  }
}

// THE MANCUNIAN WAY. The backdrop is only what does NOT move: the sky, and the city a long
// way below the deck. Everything else on this screen scrolls, and a background is baked to
// an offscreen canvas once (see buildBackground), so the road, the skyline and the roadside
// furniture are all drawn per frame by drawRoad() instead.
//
// Palette hues come from assets/reference/MANCUNIAN-WAY.md, and the values deliberately do
// not: every ground surface in the footage sits within 7.5 points of lightness of every
// other, because of the windscreen tint. Sampled straight in, the screen is one grey smear.
// The hue relationships are kept -- tarmac bluer than concrete, verge olive, brick the lone
// warm note -- and the values are opened out to something you can read at speed.
function drawMancunian(g) {
  // One sky condition, committed to. The clip runs from bright blue to overcast to a black
  // bridge shadow, and an average of those is a colour that appears in no frame of it and
  // over no part of Manchester.
  var sky = g.createLinearGradient(0, 0, 0, HORIZON_Y);
  sky.addColorStop(0, '#3f7ba2');
  sky.addColorStop(0.62, '#7fc0e4');
  sky.addColorStop(1, '#b6e4f6');
  g.fillStyle = sky;
  g.fillRect(0, 0, CANVAS_WIDTH, HORIZON_Y);

  // Cloud, pale cyan-white and never neutral -- the one value the reference is confident
  // about, because the white point in the footage stays clean.
  g.fillStyle = 'rgba(211,248,251,0.5)';
  for (var i = 0; i < CLOUDS.length; i++) {
    var c = CLOUDS[i];
    g.beginPath();
    g.ellipse(c.x, c.y, c.w, c.h, 0, 0, Math.PI * 2);
    g.fill();
  }

  // Distant city haze, sat on the horizon. It is what the far landmarks fade into, so it
  // has to be lighter than they are or a distant tower vanishes into it.
  var haze = g.createLinearGradient(0, HORIZON_Y - 70, 0, HORIZON_Y);
  haze.addColorStop(0, 'rgba(66,76,82,0)');
  haze.addColorStop(1, 'rgba(66,76,82,0.55)');
  g.fillStyle = haze;
  g.fillRect(0, HORIZON_Y - 70, CANVAS_WIDTH, 70);

  // Below the horizon is Manchester, a long way down. This is the thing the whole screen
  // kills you with, and the parapet in the footage hides it completely from inside a car --
  // which is exactly why this level draws it and the dashcam could never have.
  var below = g.createLinearGradient(0, HORIZON_Y, 0, CANVAS_HEIGHT);
  below.addColorStop(0, '#3a4148');
  below.addColorStop(0.35, '#232a30');
  below.addColorStop(1, '#12161b');
  g.fillStyle = below;
  g.fillRect(0, HORIZON_Y, CANVAS_WIDTH, CANVAS_HEIGHT - HORIZON_Y);

  // The horizon itself. Without it the skyline's bases and the top of the drop meet on a
  // hard line and the city reads as standing on a shelf.
  g.fillStyle = 'rgba(150,175,190,0.30)';
  g.fillRect(0, HORIZON_Y - 2, CANVAS_WIDTH, 4);

  // Rooftops down there, getting darker as they get closer to directly underneath.
  for (var r = 0; r < ROOFS.length; r++) {
    var rf = ROOFS[r];
    g.fillStyle = rf.c;
    g.fillRect(rf.x, HORIZON_Y + rf.y, rf.w, rf.h);
  }
  // The canal, threading through it. It is where this screen ends and where the next one
  // starts, so it is on screen from the first frame.
  g.fillStyle = '#1d3a44';
  g.fillRect(0, HORIZON_Y + 96, CANVAS_WIDTH, 16);
  g.fillStyle = 'rgba(140,190,215,0.10)';
  for (var w = 0; w < CANVAS_WIDTH; w += 74) g.fillRect(w, HORIZON_Y + 100, 38, 3);
}

// Fixed decoration for the backdrop, laid out once rather than randomised at build time --
// a background that comes out different on every load is a background you cannot review.
var CLOUDS = [
  { x: 130, y: 96,  w: 108, h: 26 }, { x: 250, y: 74, w: 74, h: 18 },
  { x: 520, y: 120, w: 132, h: 30 }, { x: 690, y: 88, w: 92, h: 22 },
  { x: 860, y: 132, w: 86,  h: 20 }
];
var ROOFS = [
  { x: 40,  y: 40, w: 130, h: 60, c: '#2b3238' }, { x: 150, y: 62, w: 90,  h: 44, c: '#252b31' },
  { x: 330, y: 34, w: 110, h: 70, c: '#2e353b' }, { x: 470, y: 56, w: 150, h: 50, c: '#262d33' },
  { x: 660, y: 30, w: 96,  h: 76, c: '#2b3238' }, { x: 790, y: 60, w: 140, h: 46, c: '#232a30' }
];

// --- Landmarks, for THE MANCUNIAN WAY.
// ---
// --- Every one is a reading of a named frame of the reference footage, authored from
// --- measurements and never traced. assets/reference/MANCUNIAN-WAY.md carries the frame
// --- each came from and what was measured off it; no frame of that footage ships.
// ---
// --- They are drawn ONCE into offscreen canvases at boot and blitted, scaled, per frame.
// --- That is what pays for the detail: the MMU block's lettering, the church tower's
// --- pinnacles and a mill's arched windows are dozens of operations each, and six of them
// --- can be on screen at once. Per-frame they cost one drawImage.

// Values are opened out from the measured ones, and the reference doc explains at length
// why: every ground surface in that footage sits within 7.5 points of lightness of every
// other because of the windscreen tint, so the measurements are hue references and not
// value references. The MMU brick measures 13-25% lightness in the clip. Sampled straight
// in, this screen would be one grey smear.
var MW = {
  concrete:  '#8d94a0',   // board-marked concrete, sunlit face
  concreteD: '#5a616c',   // ...and in shade
  concreteK: '#3c424b',   // the rib shadows
  brick:     '#8a4f42',   // MMU and the mills: measured warm-neutral at L22%, opened to L42%
  brickD:    '#653a30',
  brickK:    '#4a2a23',
  stone:     '#bdb6a6',   // the church tower
  stoneD:    '#918a7c',
  panel:     '#c8ccd2',
  steel:     '#d8dde2',
  dark:      '#23272e',
  glass:     { teal: '#4e8f86', blue: '#5a7fa8', navy: '#26344a' },
  signBlue:  '#12489e',   // this is a MOTORWAY. Blue, not green -- see SIGNS below
  signGreen: '#00703c',   // ...except at 2:07, where it stops being one
  signYellow:'#ffd200',   // route numbers on a green sign
  signBrown: '#7a4a2a',
  cladding:  '#b5532f',   // the orange-clad block at 0:11
  render:    '#dcdcd6',   // the white block at 1:24
  white:     '#eef1f4'
};

// Sign lettering is the one place on this screen that must not be the game's Courier: UK
// motorway signage is set in Transport, and a monospace slab reads as a terminal rather
// than as a road sign. A condensed system sans is as close as a build with no network can
// get, and the shape of the thing is what carries it at speed.
var SIGN_FACE = '"Arial Narrow", "Helvetica Neue", Arial, sans-serif';

// Real destinations, from the real road. The A57(M) is signed for the M602 and Salford
// westbound and the M67 and Ashton eastbound; the A5103 is Princess Parkway; the ring road
// is what the tarmac itself says at 2:00.
var SIGNS = {
  salford:   { rows: [['Salford', 'M602'], ['Ring Road', 'A57(M)']] },
  liverpool: { rows: [['Liverpool', 'M602'], ['Salford', '']] },
  princess:  { rows: [['The South', 'A5103'], ['Airport', 'M56']] },
  centre:    { rows: [['City Centre', ''], ['Universities', 'A34']] },
  // The two gantries at 1:32 and 1:41 carry M602 boards with lane arrows under them.
  m602:      { rows: [['Liverpool', 'M602'], ['Salford', '']], arrows: 2 },
  // Green, because at 2:07 the motorway is ending and the road ahead is a primary route.
  regent:    { rows: [['Regent Road', 'A57'], ['Salford', 'A5063']], green: true }
};

function fillRect(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }

// A motorway sign panel: white border, white text, a route patch hard right. Blue on
// the motorway; green with yellow route numbers once it has become an A-road, which is
// the other half of the difference a UK driver reads instantly.
function drawSignPanel(g, x, y, w, h, id) {
  var sg = SIGNS[id] || SIGNS.salford;
  fillRect(g, x, y, w, h, sg.green ? MW.signGreen : MW.signBlue);
  g.strokeStyle = MW.white;
  g.lineWidth = Math.max(1, h * 0.045);
  g.strokeRect(x + h * 0.05, y + h * 0.05, w - h * 0.1, h - h * 0.1);
  var n = sg.rows.length;
  var top = sg.arrows ? 0.22 : 0.28, gap = sg.arrows ? 0.30 : 0.42;
  g.textBaseline = 'middle';
  for (var i = 0; i < n; i++) {
    var ry = y + h * (top + i * gap);
    g.fillStyle = MW.white;
    g.font = 'bold ' + Math.round(h * 0.23) + 'px ' + SIGN_FACE;
    g.textAlign = 'left';
    g.fillText(sg.rows[i][0], x + w * 0.10, ry);
    if (sg.rows[i][1]) {
      g.textAlign = 'right';
      if (sg.green) g.fillStyle = MW.signYellow;
      g.fillText(sg.rows[i][1], x + w * 0.93, ry);
    }
  }
  // Lane arrows along the bottom edge, one per lane the board applies to.
  if (sg.arrows) {
    g.fillStyle = MW.white;
    for (var a = 0; a < sg.arrows; a++) {
      var ax = x + w * (0.30 + 0.40 * a / Math.max(1, sg.arrows - 1));
      var ay = y + h * 0.78;
      g.beginPath();
      g.moveTo(ax - h * 0.07, ay);
      g.lineTo(ax + h * 0.07, ay);
      g.lineTo(ax, ay + h * 0.13);
      g.closePath();
      g.fill();
    }
  }
  g.textAlign = 'left';
}

// Each landmark declares its real size in metres, so the descriptor's route can be checked
// against the survey rather than against a pixel count, and `base` -- where its foot sits
// relative to the tarmac. Buildings stand on the ground, fifteen metres below the deck;
// gantries and bridges stand on the road itself.
var LANDMARKS = {

  // Frame 0:48, and the most identifiable object in the whole clip: dark brick, a stepped
  // roofline, and MANCHESTER METROPOLITAN UNIVERSITY in white down a dark panel with the
  // roundel above it. Nothing else on this road names itself.
  mmu: { w: 62, h: 34, base: -15, draw: function (g, W, H) {
    // Three masses stepping up to the right, and the tallest carries the name. In the
    // footage the lettering block rises a clear storey above everything beside it -- drawn
    // level with them it reads as a warehouse, which is most of what went wrong first time.
    var tallX = W * 0.56, tallW = W * 0.38;
    fillRect(g, 0,        H * 0.46, W * 0.20, H * 0.54, MW.brickD);
    fillRect(g, W * 0.18, H * 0.32, W * 0.40, H * 0.68, MW.brick);
    fillRect(g, tallX,    H * 0.00, tallW,    H * 1.00, MW.brick);
    // A lighter course on each step, so three flat masses of one colour still read as three.
    fillRect(g, 0,        H * 0.46, W * 0.20, H * 0.018, MW.stoneD);
    fillRect(g, W * 0.18, H * 0.32, W * 0.40, H * 0.018, MW.stoneD);
    fillRect(g, tallX,    H * 0.00, tallW,    H * 0.020, MW.stoneD);
    fillRect(g, W * 0.18, H * 0.32, W * 0.022, H * 0.68, MW.brickD);
    fillRect(g, tallX,    H * 0.00, W * 0.022, H * 1.00, MW.brickD);
    // The name, which is the single most identifying thing on this road.
    var px = tallX + tallW * 0.07, pw = tallW * 0.86;
    fillRect(g, px, H * 0.045, pw, H * 0.255, '#282c34');
    g.fillStyle = '#5b9bd8';
    g.beginPath();
    g.arc(px + pw / 2, H * 0.093, H * 0.030, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = MW.white;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    var lines = ['MANCHESTER', 'METROPOLITAN', 'UNIVERSITY'];
    g.font = 'bold ' + Math.round(H * 0.050) + 'px ' + SIGN_FACE;
    for (var i = 0; i < 3; i++) g.fillText(lines[i], px + pw / 2, H * (0.163 + i * 0.058));
    g.textAlign = 'left';
    // Ribbon windows: the lower floors are long horizontal bands, not punched holes.
    for (var b = 0; b < 3; b++) {
      var by = H * (0.56 + b * 0.13);
      fillRect(g, W * 0.025, by, W * 0.53, H * 0.068, '#2e323a');
      fillRect(g, W * 0.025, by + H * 0.068, W * 0.53, H * 0.011, MW.stoneD);
      fillRect(g, tallX + tallW * 0.10, by, tallW * 0.80, H * 0.068, '#2e323a');
    }
    fillRect(g, 0, H * 0.95, W, H * 0.05, MW.brickK);
  } },

  // Frame 1:46. A square Gothic tower with four corner pinnacles, on the skyline south of
  // the road. The pinnacles are the whole silhouette -- without them it is a chimney.
  church: { w: 17, h: 44, base: -15, draw: function (g, W, H) {
    fillRect(g, W * 0.16, H * 0.22, W * 0.68, H * 0.78, MW.stone);
    fillRect(g, W * 0.16, H * 0.22, W * 0.055, H * 0.78, MW.stoneD);
    fillRect(g, W * 0.785, H * 0.22, W * 0.055, H * 0.78, MW.stoneD);
    // The parapet oversails, which is what gives the pinnacles something to stand on.
    fillRect(g, W * 0.10, H * 0.205, W * 0.80, H * 0.050, MW.stone);
    fillRect(g, W * 0.10, H * 0.245, W * 0.80, H * 0.014, MW.stoneD);
    // Four corner pinnacles, and they carry the whole silhouette: without them this is a
    // chimney. Wide enough to survive being forty pixels tall at the far end of the road.
    var px = [0.09, 0.335, 0.575, 0.82];
    for (var i = 0; i < 4; i++) {
      var x = W * px[i], w = W * 0.125;
      fillRect(g, x, H * 0.075, w, H * 0.130, MW.stone);
      fillRect(g, x, H * 0.075, w * 0.30, H * 0.130, MW.stoneD);
      g.fillStyle = MW.stone;
      g.beginPath();
      g.moveTo(x - w * 0.22, H * 0.080);
      g.lineTo(x + w / 2, H * 0.002);
      g.lineTo(x + w * 1.22, H * 0.080);
      g.closePath();
      g.fill();
    }
    // Paired belfry lancets, a stringcourse, and a clock stage below it.
    for (var k = 0; k < 2; k++) {
      var lx = W * (0.30 + k * 0.24);
      fillRect(g, lx, H * 0.335, W * 0.155, H * 0.185, '#39362f');
      g.fillStyle = '#39362f';
      g.beginPath();
      g.arc(lx + W * 0.0775, H * 0.335, W * 0.0775, Math.PI, 0);
      g.fill();
    }
    fillRect(g, W * 0.20, H * 0.575, W * 0.60, H * 0.018, MW.stoneD);
    g.fillStyle = '#e7e2d4';
    g.beginPath();
    g.arc(W * 0.50, H * 0.655, W * 0.115, 0, Math.PI * 2);
    g.fill();
    g.strokeStyle = '#4a463d';
    g.lineWidth = Math.max(1, W * 0.018);
    g.beginPath();
    g.moveTo(W * 0.50, H * 0.655); g.lineTo(W * 0.50, H * 0.615);
    g.moveTo(W * 0.50, H * 0.655); g.lineTo(W * 0.565, H * 0.665);
    g.stroke();
    fillRect(g, W * 0.20, H * 0.755, W * 0.60, H * 0.016, MW.stoneD);
    fillRect(g, W * 0.36, H * 0.800, W * 0.28, H * 0.200, '#4a463d');
  } },

  // Frame 0:50. Two box legs, a deep box beam, blue panels sitting ON TOP of it and a
  // white lane arrow on its face. Getting the panels above the beam rather than hanging
  // below it is most of what makes it read as a British gantry. Which panels is the
  // mark's business (`sign`), so five gantries on one road do not all say the same thing.
  gantry: { w: 30, h: 11, base: 0, span: true, soffit: 6.2, draw: function (g, W, H, m) {
    var signs = (m && m.sign) || ['salford', 'centre'];
    fillRect(g, W * 0.05, H * 0.38, W * 0.055, H * 0.62, MW.dark);
    fillRect(g, W * 0.895, H * 0.38, W * 0.055, H * 0.62, MW.dark);
    fillRect(g, W * 0.02, H * 0.30, W * 0.96, H * 0.14, '#2c3138');
    fillRect(g, W * 0.02, H * 0.30, W * 0.96, H * 0.02, '#454c55');
    if (signs.length > 1) {
      drawSignPanel(g, W * 0.12, H * 0.02, W * 0.36, H * 0.27, signs[0]);
      drawSignPanel(g, W * 0.52, H * 0.02, W * 0.36, H * 0.27, signs[1]);
    } else {
      drawSignPanel(g, W * 0.30, H * 0.02, W * 0.40, H * 0.27, signs[0]);
    }
    // The lane arrow, in a white box on the beam.
    fillRect(g, W * 0.19, H * 0.325, W * 0.075, H * 0.09, MW.white);
    g.fillStyle = MW.dark;
    g.beginPath();
    g.moveTo(W * 0.205, H * 0.345);
    g.lineTo(W * 0.258, H * 0.345);
    g.lineTo(W * 0.2315, H * 0.40);
    g.closePath();
    g.fill();
  } },

  // Frame 0:09. A white steel bowstring arch. It stands BESIDE the carriageway, over the
  // side street to the left -- the close-up burst is unambiguous, and the first survey had
  // it crossing the road. The deck is a line rather than a band: a solid deck at this size
  // is a grey bar across the whole view as you pass.
  archBridge: { w: 38, h: 14, base: 0, draw: function (g, W, H) {
    fillRect(g, 0, H * 0.74, W, H * 0.035, '#39404a');
    fillRect(g, 0, H * 0.74, W, H * 0.012, MW.steel);
    g.strokeStyle = MW.steel;
    g.lineWidth = Math.max(2, H * 0.055);
    g.beginPath();
    g.moveTo(W * 0.05, H * 0.76);
    g.quadraticCurveTo(W * 0.5, H * -0.30, W * 0.95, H * 0.76);
    g.stroke();
    g.lineWidth = Math.max(1, H * 0.018);
    for (var i = 1; i < 8; i++) {
      var t = i / 8;
      var x = W * (0.05 + 0.9 * t);
      var y = H * (0.76 + (-1.06) * (2 * t * (1 - t)) * 1.0);
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x, H * 0.745);
      g.stroke();
    }
    fillRect(g, 0, H * 0.60, W * 0.06, H * 0.40, MW.concreteD);
    fillRect(g, W * 0.94, H * 0.60, W * 0.06, H * 0.40, MW.concreteD);
  } },

  // Frame 1:36. A steel lattice footbridge -- a shallow truss with a ramp either side.
  // Twelve metres tall as a sprite so the truss can sit 6.6m up: drawn to its real 10m
  // with the deck at half height, its underside was below the camera's eye and the whole
  // thing crossed the screen as a dark bar.
  latticeBridge: { w: 34, h: 12, base: 0, span: true, soffit: 6.6, draw: function (g, W, H) {
    fillRect(g, W * 0.06, H * 0.05, W * 0.88, H * 0.030, '#6d757f');
    fillRect(g, W * 0.06, H * 0.42, W * 0.88, H * 0.030, '#6d757f');
    g.strokeStyle = '#6d757f';
    g.lineWidth = Math.max(1, H * 0.018);
    g.beginPath();
    for (var i = 0; i < 12; i++) {
      var x0 = W * (0.06 + 0.88 * i / 12), x1 = W * (0.06 + 0.88 * (i + 1) / 12);
      g.moveTo(x0, H * (i % 2 ? 0.065 : 0.435));
      g.lineTo(x1, H * (i % 2 ? 0.435 : 0.065));
    }
    g.stroke();
    // Verticals at every panel point, which is what makes it a truss and not a zigzag.
    for (var v = 0; v <= 12; v++) {
      fillRect(g, W * (0.06 + 0.88 * v / 12) - H * 0.008, H * 0.05, H * 0.016, H * 0.40, '#6d757f');
    }
    fillRect(g, 0, H * 0.40, W * 0.07, H * 0.08, '#6d757f');
    fillRect(g, W * 0.93, H * 0.40, W * 0.07, H * 0.08, '#6d757f');
    fillRect(g, 0, H * 0.46, W * 0.05, H * 0.54, MW.concreteD);
    fillRect(g, W * 0.95, H * 0.46, W * 0.05, H * 0.54, MW.concreteD);
  } },

  // Frames 0:16-0:30. A 1960s point block: pale concrete, a regular grid, a darker
  // circulation stripe and a lift overrun on the roof.
  towerBlock: { w: 19, h: 58, base: -15, draw: function (g, W, H) {
    fillRect(g, 0, H * 0.05, W, H * 0.95, MW.concrete);
    fillRect(g, W * 0.70, H * 0.05, W * 0.24, H * 0.95, MW.concreteD);
    fillRect(g, W * 0.30, H * 0.005, W * 0.34, H * 0.05, MW.concreteD);
    for (var r = 0; r < 17; r++) {
      var y = H * (0.085 + r * 0.052);
      for (var c = 0; c < 3; c++) {
        fillRect(g, W * (0.07 + c * 0.21), y, W * 0.15, H * 0.030, '#39414c');
      }
      fillRect(g, W * 0.74, y, W * 0.09, H * 0.030, '#2f363f');
    }
    fillRect(g, 0, H * 0.95, W, H * 0.05, MW.concreteK);
  } },

  // Frames 0:26-0:34, close on the left: three deck-access blocks in a row, and their
  // banding is the whole identity -- storeys of balcony recess reading as horizontal
  // stripes. One in pale concrete, two in brown brick; one drawing, two tints.
  slabBlock:  { w: 48, h: 26, base: -15, draw: function (g, W, H) { drawSlab(g, W, H, false); } },
  brownBlock: { w: 40, h: 24, base: -15, draw: function (g, W, H) { drawSlab(g, W, H, true); } },

  // Frames 0:50-1:08. Curtain wall, three tints, all of them in the clip: the teal slab
  // opposite the MMU block, the blue one at 0:56 and the near-black one at 1:04.
  glassTeal: { w: 27, h: 34, base: -15, draw: function (g, W, H) { drawGlass(g, W, H, 'teal'); } },
  glassBlue: { w: 25, h: 40, base: -15, draw: function (g, W, H) { drawGlass(g, W, H, 'blue'); } },
  glassNavy: { w: 22, h: 44, base: -15, draw: function (g, W, H) { drawGlass(g, W, H, 'navy'); } },

  // Frames 2:02-2:08. Red brick, arched windows in a regular grid, stone sills, a parapet,
  // and a chimney a full mill's height above the roof. The one building type on this road
  // that could not be anywhere else in England, and the chimney is what says so first.
  brickMill: { w: 46, h: 36, base: -15, draw: function (g, W, H) {
    var top = H * 0.34;                       // the mill body; the chimney rises above it
    fillRect(g, 0, top, W, H - top, MW.brick);
    fillRect(g, 0, top, W, H * 0.025, MW.brickD);
    fillRect(g, W * 0.42, top - H * 0.05, W * 0.16, H * 0.05, MW.brick);
    for (var r = 0; r < 4; r++) {
      for (var c = 0; c < 7; c++) {
        var x = W * (0.045 + c * 0.132), y = top + H * (0.10 + r * 0.14);
        var w = W * 0.085, h = H * 0.08;
        fillRect(g, x, y, w, h, '#2f2a2c');
        g.fillStyle = '#2f2a2c';
        g.beginPath();
        g.arc(x + w / 2, y, w / 2, Math.PI, 0);
        g.fill();
        fillRect(g, x - w * 0.12, y + h, w * 1.24, H * 0.011, MW.stoneD);
      }
      fillRect(g, 0, top + H * (0.075 + r * 0.14), W, H * 0.008, MW.brickD);
    }
    // The chimney: square, tapering slightly, an oversailing cap, a soot line.
    g.fillStyle = MW.brick;
    g.beginPath();
    g.moveTo(W * 0.855, top); g.lineTo(W * 0.925, top);
    g.lineTo(W * 0.915, H * 0.03); g.lineTo(W * 0.865, H * 0.03);
    g.closePath();
    g.fill();
    fillRect(g, W * 0.855, top, W * 0.018, H - top, MW.brickD);
    fillRect(g, W * 0.855, H * 0.00, W * 0.07, H * 0.035, MW.stoneD);
    fillRect(g, W * 0.86, H * 0.035, W * 0.06, H * 0.02, MW.brickK);
    fillRect(g, 0, H * 0.96, W, H * 0.04, MW.brickK);
  } },

  // Frame 2:16. Red brick railway arches, which is how half of central Manchester is held
  // up -- and the road goes UNDER them. The 2:18 blackout is their underside. A wide
  // girder span sits over the carriageway with brick arches marching off either side, so
  // the sprite is transparent through the middle and the road is drawn on through it.
  viaduct: { w: 70, h: 17, base: 0, span: true, soffit: 6.0, draw: function (g, W, H) {
    fillRect(g, 0, H * 0.10, W, H * 0.90, MW.brick);
    fillRect(g, 0, H * 0.10, W, H * 0.05, MW.brickD);
    fillRect(g, 0, H * 0.04, W, H * 0.06, MW.stoneD);
    var cxs = [0.09, 0.24, 0.76, 0.91];
    for (var i = 0; i < 4; i++) {
      var cx = W * cxs[i], r = W * 0.058;
      g.fillStyle = '#241f21';
      g.beginPath();
      g.arc(cx, H * 0.56, r, Math.PI, 0);
      g.fill();
      g.fillRect(cx - r, H * 0.56, r * 2, H * 0.44);
      g.strokeStyle = MW.brickD;
      g.lineWidth = Math.max(1, H * 0.02);
      g.beginPath();
      g.arc(cx, H * 0.56, r * 1.12, Math.PI, 0);
      g.stroke();
    }
    // The span over the road: a riveted girder on brick piers, and daylight under it.
    g.clearRect(W * 0.345, H * 0.65, W * 0.31, H * 0.35);
    fillRect(g, W * 0.33, H * 0.50, W * 0.34, H * 0.15, '#39404a');
    fillRect(g, W * 0.33, H * 0.50, W * 0.34, H * 0.025, '#5d656f');
    fillRect(g, W * 0.33, H * 0.625, W * 0.34, H * 0.025, '#23272e');
    for (var k = 0; k < 9; k++) fillRect(g, W * (0.345 + k * 0.038), H * 0.555, H * 0.02, H * 0.02, '#5d656f');
    fillRect(g, W * 0.33, H * 0.65, W * 0.02, H * 0.35, MW.brickK);
    fillRect(g, W * 0.65, H * 0.65, W * 0.02, H * 0.35, MW.brickK);
  } },

  // Frame 2:12. A glazed tube crossing the road on two legs. Odd enough to be a landmark
  // on its own. Twelve metres as a sprite so the tube sits 6.6m up: at eight it was below
  // the camera's eye and filled the screen as you reached it.
  tubeBridge: { w: 34, h: 12, base: 0, span: true, soffit: 6.6, draw: function (g, W, H) {
    var y = H * 0.06, hh = H * 0.38;
    g.fillStyle = MW.panel;
    g.beginPath();
    if (g.roundRect) g.roundRect(W * 0.06, y, W * 0.88, hh, hh / 2);
    else g.rect(W * 0.06, y, W * 0.88, hh);
    g.fill();
    fillRect(g, W * 0.10, y + hh * 0.28, W * 0.80, hh * 0.34, '#4d7f92');
    for (var i = 0; i < 14; i++) {
      fillRect(g, W * (0.11 + i * 0.058), y + hh * 0.28, W * 0.006, hh * 0.34, MW.panel);
    }
    fillRect(g, W * 0.10, H * 0.44, W * 0.05, H * 0.56, MW.concreteD);
    fillRect(g, W * 0.85, H * 0.44, W * 0.05, H * 0.56, MW.concreteD);
  } },

  // Frame 2:10. A concrete A-frame carrying a slip road over the junction.
  pylon: { w: 13, h: 22, base: -15, draw: function (g, W, H) {
    g.fillStyle = MW.concrete;
    g.beginPath();
    g.moveTo(W * 0.36, 0); g.lineTo(W * 0.64, 0);
    g.lineTo(W * 0.94, H); g.lineTo(W * 0.70, H);
    g.lineTo(W * 0.50, H * 0.36); g.lineTo(W * 0.30, H);
    g.lineTo(W * 0.06, H); g.closePath();
    g.fill();
    fillRect(g, W * 0.22, 0, W * 0.56, H * 0.07, MW.concreteD);
  } },

  // Frame 0:04. The brown signs are tourist destinations, and on this road they are a list
  // of Manchester's museums -- which is about as locating as a sign can get.
  touristSign: { w: 8, h: 6, base: 0, draw: function (g, W, H) {
    fillRect(g, W * 0.20, H * 0.52, W * 0.07, H * 0.48, '#6b6f75');
    fillRect(g, W * 0.73, H * 0.52, W * 0.07, H * 0.48, '#6b6f75');
    fillRect(g, W * 0.04, H * 0.04, W * 0.92, H * 0.52, MW.signBrown);
    g.strokeStyle = MW.white;
    g.lineWidth = Math.max(1, H * 0.014);
    g.strokeRect(W * 0.07, H * 0.07, W * 0.86, H * 0.46);
    g.fillStyle = MW.white;
    g.textAlign = 'left';
    g.textBaseline = 'middle';
    g.font = 'bold ' + Math.round(H * 0.075) + 'px ' + SIGN_FACE;
    var rows = ['Manchester Art Gallery', 'Whitworth Art Gallery', 'Manchester Museum'];
    for (var i = 0; i < 3; i++) g.fillText(rows[i], W * 0.12, H * (0.17 + i * 0.14));
  } },

  // Frames 0:07 and 1:20: the same portrait hoarding twice, on a slim column at the deck
  // edge. Deliberately an abstract poster -- the real one is somebody's advertising
  // campaign, and this screen authors everything it shows. Portrait, black and white,
  // a figure: that much is what the eye reads at speed.
  hoarding: { w: 7, h: 13, base: 0, draw: function (g, W, H) {
    fillRect(g, W * 0.44, H * 0.62, W * 0.12, H * 0.38, '#5c626b');
    fillRect(g, W * 0.03, H * 0.02, W * 0.94, H * 0.62, '#1d222a');
    fillRect(g, W * 0.07, H * 0.05, W * 0.86, H * 0.53, '#c9ccd0');
    g.fillStyle = '#2a2d33';
    g.beginPath();
    g.ellipse(W * 0.50, H * 0.24, W * 0.17, H * 0.11, 0, 0, Math.PI * 2);
    g.fill();
    fillRect(g, W * 0.24, H * 0.36, W * 0.52, H * 0.22, '#2a2d33');
    fillRect(g, W * 0.07, H * 0.53, W * 0.86, H * 0.05, MW.white);
  } },

  // Frame 0:10. The motorway begins, and the sign says so: the white bridge-over-road
  // symbol on blue, A57(M), and a 50 roundel on top. Cheap, and about as locating as a
  // sign gets for anyone who has driven in Britain.
  motorwaySign: { w: 3, h: 5.5, base: 0, draw: function (g, W, H) {
    fillRect(g, W * 0.22, H * 0.55, W * 0.06, H * 0.45, '#6b6f75');
    fillRect(g, W * 0.72, H * 0.55, W * 0.06, H * 0.45, '#6b6f75');
    fillRect(g, W * 0.04, H * 0.30, W * 0.92, H * 0.30, MW.signBlue);
    g.strokeStyle = MW.white;
    g.lineWidth = Math.max(1, H * 0.012);
    g.strokeRect(W * 0.07, H * 0.32, W * 0.86, H * 0.26);
    // The symbol: a bridge across a road that narrows to the horizon.
    g.lineWidth = Math.max(1, H * 0.018);
    g.beginPath();
    g.moveTo(W * 0.30, H * 0.50); g.lineTo(W * 0.44, H * 0.36);
    g.moveTo(W * 0.70, H * 0.50); g.lineTo(W * 0.56, H * 0.36);
    g.stroke();
    fillRect(g, W * 0.28, H * 0.40, W * 0.44, H * 0.018, MW.white);
    g.fillStyle = MW.white;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.font = 'bold ' + Math.round(H * 0.055) + 'px ' + SIGN_FACE;
    g.fillText('A57(M)', W * 0.50, H * 0.545);
    // The roundel.
    g.fillStyle = MW.white;
    g.beginPath();
    g.arc(W * 0.50, H * 0.15, H * 0.12, 0, Math.PI * 2);
    g.fill();
    g.strokeStyle = '#c8281e';
    g.lineWidth = Math.max(1, H * 0.03);
    g.beginPath();
    g.arc(W * 0.50, H * 0.15, H * 0.105, 0, Math.PI * 2);
    g.stroke();
    g.fillStyle = '#1d222a';
    g.font = 'bold ' + Math.round(H * 0.11) + 'px ' + SIGN_FACE;
    g.fillText('50', W * 0.50, H * 0.155);
    g.textAlign = 'left';
  } },

  // Frames 0:08-0:14. An orange-clad apartment block across the junction on the right:
